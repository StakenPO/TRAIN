    else {id="p"+Date.now().toString(36); S.products.push(Object.assign({id},data))}
    const back=ctx.back; commit();
    if(back&&back.mode==="day"){ctx={onlyDay:true}; startDayAdd(id)}
    else if(back&&back.mode==="dish"){editDish.items.push({pid:id,g:100}); closeSheet(); render()}
    else if(back){ctx={s:back.s,i:back.i,mode:back.mode}; sheetOptions(id)} else closeSheet();
    return}
  if(a==="delprod"){document.getElementById("delConfirm").innerHTML=`<div class="hint warn">Продукт пропадёт из списка и из всех приёмов пищи.</div><button class="btn danger block" data-act="delok">Да, удалить</button>`; return}
  if(a==="delok"){const id=ctx.pidEdit; S.dishes.forEach(ds=>ds.items=ds.items.filter(it=>it.pid!==id)); S.products=S.products.filter(p=>p.id!==id); S.slots.forEach(s=>s.variants.forEach(v=>v.items=v.items.filter(it=>it.pid!==id))); closeSheet(); commit(); return}
  if(a==="seg"&&b.dataset.k==="goal"&&S.profile.goal!==b.dataset.v){switchGoal(b.dataset.v); commit(); return}
  if(a==="planregen"){document.getElementById("regenBox").innerHTML=`<div class="hint warn">Собрать план «${GOALS[S.planGoal]}» заново из готового меню? Ваши изменения в этом плане пропадут, планы других целей не тронутся.</div><button class="btn danger block" data-act="planregenok">Да, собрать заново</button>`; return}
  if(a==="planregenok"){buildPlan(S.planGoal); commit(); return}
  if(a==="seg"){S.profile[b.dataset.k]=b.dataset.v; commit(); return}
  if(a==="bkcopy"){const t=exportText(); const box=document.getElementById("bkOutBox");
    const show=()=>{box.innerHTML=`<div class="field"><label for="bkOut">Выделите и скопируйте</label><textarea id="bkOut" rows="3" readonly></textarea></div>`; const ta=document.getElementById("bkOut"); ta.value=t; ta.focus(); ta.select()};
    try{navigator.clipboard.writeText(t).then(()=>{box.innerHTML=`<div class="hint">Скопировано. Теперь вставьте в другой версии.</div>`},show)}catch(e){show()} return}
  if(a==="bkfile"){(async()=>{const m=document.getElementById("bkMsg"); m.innerHTML=`<div class="note">Собираю файл с фото…</div>`; const ph=await photosForExport(); const o=JSON.parse(exportText()); o.photos=ph; const blob=new Blob([JSON.stringify(o)],{type:"application/json"}); const u=URL.createObjectURL(blob); const l=document.createElement("a"); l.href=u; l.download="racion-"+dateKey+".json"; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000); m.innerHTML=`<div class="hint">Файл сохранён${Object.keys(ph).length?", фото внутри: "+Object.keys(ph).length:""}.</div>`})(); return}
  if(a==="bkimport"){bkAsk(document.getElementById("bkIn").value); return}
  if(a==="bkok"){if(ctx.bkData){const ph=ctx.bkPhotos; useRoot(clone(ctx.bkData)); if(ph) photosImport(ph).then(()=>render()); ctx={}; selDay=todayIdx; editDish=null; commit(); window.scrollTo(0,0)} return}
  if(a==="recmacro"){const m=recMacros(S.profile.goal); S.profile.pPerKg=m.p; S.profile.fPerKg=m.f; commit(); return}
  if(a==="accswitch"){if(ROOT.accounts[b.dataset.id]){ROOT.active=b.dataset.id; S=ROOT.accounts[ROOT.active].state; selDay=todayIdx; editDish=null; commit()} return}
  if(a==="accnew"){document.getElementById("accBox").innerHTML=`<div class="field"><label for="accName">Имя нового аккаунта</label><input id="accName" placeholder="например, Набор весной"></div><div class="grid2"><button class="btn primary block" data-act="accnewok" data-copy="0">Начать с шаблона</button><button class="btn block" data-act="accnewok" data-copy="1">Копия текущего</button></div>`; return}
  if(a==="accnewok"){const n=(document.getElementById("accName").value||"").trim()||"Новый аккаунт"; const id="a"+Date.now().toString(36);
    ROOT.accounts[id]={name:n,state:b.dataset.copy==="1"?fix(clone(S)):fix(clone(DEFAULT))}; ROOT.active=id; S=ROOT.accounts[id].state; selDay=todayIdx; editDish=null; commit(); window.scrollTo(0,0); return}
  if(a==="accrename"){const ids=Object.keys(ROOT.accounts); document.getElementById("accBox").innerHTML=`<div class="field"><label for="accRen">Новое имя</label><input id="accRen" value="${esc(ROOT.accounts[ROOT.active].name)}"></div><button class="btn primary block" data-act="accrenok">Сохранить имя</button>`; return}
  if(a==="accrenok"){const n=document.getElementById("accRen").value.trim(); if(n){ROOT.accounts[ROOT.active].name=n; commit()} return}
  if(a==="accdel"){const one=Object.keys(ROOT.accounts).length===1, nm=esc(ROOT.accounts[ROOT.active].name);
    document.getElementById("accBox").innerHTML=`<div class="hint warn">Удалить аккаунт «${nm}»? Пропадут его данные, продукты, блюда, рационы, тренировки и фотоотчёты. Это не отменить.${one?" Это ваш единственный аккаунт, поэтому вместо него сразу будет создан новый, чистый.":""}</div>
      <div class="note">Если данные могут пригодиться, сначала сделайте резервную копию ниже: «Скачать файл».</div>
      <div class="field"><label for="accDelName">Для подтверждения впишите имя аккаунта: ${nm}</label><input id="accDelName" autocomplete="off"></div>
      <div class="grid2"><button class="btn danger block" data-act="accdelok">Удалить</button><button class="btn block" data-act="accdelno">Отмена</button></div><div id="accDelMsg" class="note" style="color:var(--bad)"></div>`;
    document.getElementById("accBox").scrollIntoView({block:"center"}); return}
  if(a==="accdelno"){document.getElementById("accBox").innerHTML=""; return}
  if(a==="accdelok"){const acc=ROOT.accounts[ROOT.active], typed=(document.getElementById("accDelName").value||"").trim().toLowerCase();
    if(typed!==acc.name.trim().toLowerCase()){document.getElementById("accDelMsg").textContent="Имя не совпадает. Впишите его точно, как в списке."; return}
    try{const ph=[]; ((acc.state.body||{}).entries||[]).forEach(e=>Object.values(e.photos||{}).forEach(id=>ph.push(id))); ph.forEach(id=>PDB.del(id))}catch(x){}
    if(TR().active) TR().active=null;
    delete ROOT.accounts[ROOT.active];
    if(!Object.keys(ROOT.accounts).length){const id="a"+Date.now().toString(36); ROOT.accounts[id]={name:"Новый аккаунт",state:fix(clone(DEFAULT))}}
    ROOT.active=Object.keys(ROOT.accounts)[0]; S=ROOT.accounts[ROOT.active].state; selDay=todayIdx; editDish=null; editDay=null; commit(); window.scrollTo(0,0); return}
  if(a==="pview"){prodView=b.dataset.v; render(); return}
  if(a==="recgoal"){recGoal=b.dataset.v; render(); return}
  if(a==="addcat"){const c=CATALOG.find(x=>x.id===b.dataset.id); if(c&&!haveCat(c)){const p={id:P(c.id)?"p"+Date.now().toString(36):c.id,catId:c.id,name:c.name,kcal:c.kcal,p:c.p,f:c.f,c:c.c}; if(c.pieceG){p.pieceG=c.pieceG;p.pieceName=c.pieceName} S.products.push(p); commit()} return}
});
function liveItem(){const it=curVariant().items[ctx.i]; const m=mac({pid:it.pid,g:num(gIn.value)}); itemMac.innerHTML=macChips(m)}
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="gIn"){liveItem(); return}
  if(t.id==="dName"){editDish.name=t.value; return}
  if(t.classList&&t.classList.contains("dg")){editDish.items[+t.dataset.i].g=num(t.value); dishCalcRefresh(); return}
  if(t.id==="dDay"){dfit.d=+t.value; dishCalcRefresh(); return}
  if(t.id==="daG"){ctx.pend.g=num(t.value); daRes.innerHTML=dayAddRes(); return}
  if(t.id==="pSearch"){pList.innerHTML=pickRows(t.value,ctx.mode==="swap"?curVariant().items[ctx.i].pid:null); return}
  if(t.id==="cG"){const np=P(ctx.pid), g=num(t.value); cRes.innerHTML = g>0 ? (()=>{const res=add(ctx.base,[np.kcal,np.p,np.f,np.c].map(x=>x*g/100)); return `День: <span class="num">${r(res[0])}</span> ккал, белок <span class="num">${r(res[1])}</span> г. ${verdict(res,dayTarget(selDay))}`})() : ""; return}
  if(["pfK","pfP","pfF","pfC"].includes(t.id)){checkProd(); return}
  if(t.dataset.pf){S.profile[t.dataset.pf]= t.tagName==="SELECT"?num(t.value):t.value; commit(false); const gr=document.getElementById("goalRes"); if(gr) gr.innerHTML=goalRes(); return}
});
document.addEventListener("change",e=>{const t=e.target; if(t.id==="bkFileIn"&&t.files&&t.files[0]){const fr=new FileReader(); fr.onload=()=>bkAsk(String(fr.result)); fr.readAsText(t.files[0]); t.value=""; return} if(t.dataset&&t.dataset.pf){S.profile[t.dataset.pf]=t.tagName==="SELECT"?num(t.value):t.value; commit(false); const gr=document.getElementById("goalRes"); if(gr) gr.innerHTML=goalRes()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!document.getElementById("sheet").hidden) closeSheet()});

/* ---------- Старт ---------- */
let tipsOn=(()=>{try{return localStorage.getItem("ration_tips")==="1"}catch(e){return false}})();
document.body.classList.toggle("tips",tipsOn);
document.addEventListener("click",e=>{const b=e.target.closest('[data-act="tips"]'); if(!b) return; tipsOn=b.dataset.v==="1"; try{localStorage.setItem("ration_tips",tipsOn?"1":"0")}catch(x){} document.body.classList.toggle("tips",tipsOn); render()});
useRoot(loadLocal());
render();
connect();
