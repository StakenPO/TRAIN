<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f151b" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>Мой рацион</title>
<meta name="apple-mobile-web-app-title" content="Рацион">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: phone app. One column, sticky-free; tab bar fixed at the bottom; editing happens in bottom sheets. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --raise:#f6f8fa; --ink:#15202b; --muted:#5d6b78; --line:#d8dee5;
  --accent:#0f6e6a; --accent-ink:#ffffff; --accent-soft:#d6ecea;
  --protein:#b55a12; --protein-soft:#f6e3d2;
  --ok:#2f7d3c; --ok-soft:#dcefdf; --warn:#a46a00; --warn-soft:#fbefd2; --bad:#b3362c; --bad-soft:#f7dcd9;
  --shade:rgba(10,18,26,.45);
  --f-text:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#18212a; --raise:#1f2a35; --ink:#e7edf2; --muted:#93a1ae; --line:#2a3642;
  --accent:#4fc2bb; --accent-ink:#06201f; --accent-soft:#163a39;
  --protein:#f0a463; --protein-soft:#3a2716;
  --ok:#6cc47a; --ok-soft:#17321c; --warn:#e8b54a; --warn-soft:#382a0c; --bad:#f08a80; --bad-soft:#3d1b18;
  --shade:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#18212a; --raise:#1f2a35; --ink:#e7edf2; --muted:#93a1ae; --line:#2a3642;
  --accent:#4fc2bb; --accent-ink:#06201f; --accent-soft:#163a39;
  --protein:#f0a463; --protein-soft:#3a2716;
  --ok:#6cc47a; --ok-soft:#17321c; --warn:#e8b54a; --warn-soft:#382a0c; --bad:#f08a80; --bad-soft:#3d1b18;
  --shade:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-text);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.wrap{max-width:540px;margin:0 auto;padding-block:18px calc(96px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header */
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{margin:2px 0 0;font-size:27px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
h2{margin:0;font-size:18px;font-weight:800}
.sub{color:var(--muted);font-size:14px}
.sync{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--ok)} .sync.err i{background:var(--bad)}
.toprow{display:flex;flex-direction:column;align-items:flex-start;gap:6px}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.kpi{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.kpi .big{font-size:30px;font-weight:700;letter-spacing:-.02em}
.kpi .of{color:var(--muted);font-size:13px}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--raise);color:var(--muted)}
.mrow{display:grid;grid-template-columns:74px 1fr auto;align-items:center;gap:10px;font-size:13px}
.mrow .lbl{color:var(--muted);font-weight:600}
.mrow .val{white-space:nowrap}
.bar{height:7px;border-radius:99px;background:var(--raise);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar.p>i{background:var(--protein)}
.bar.f>i{background:var(--warn)}
.bar.c>i{background:var(--muted)}

/* Week */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dayb{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
.dayb .wd{font-size:13px;font-weight:800}
.dayb .k{font-size:10px;color:var(--muted);font-family:var(--f-num)}
.dayb.today{border-color:var(--accent)}
.dish{appearance:none;border:0;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;margin-top:4px;cursor:pointer;max-width:100%;text-align:left}
.opt.cur{border-color:var(--accent);background:var(--accent-soft)}
.opt .ing{font-size:13px;color:var(--ink)}
.opt .buy{font-size:12px;color:var(--warn);font-weight:700}
.dayb.mod .wd::after{content:"•";color:var(--warn);margin-left:2px}
.dayb.mod[aria-pressed="true"] .wd::after{color:var(--accent-ink)}
.dayb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dayb[aria-pressed="true"] .k{color:var(--accent-ink);opacity:.8}

/* Meals */
.meal{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.meal.eaten{border-color:var(--ok)}
.mhead{display:flex;align-items:flex-start;gap:10px;padding:14px 16px 8px}
.mhead .t{flex:1;min-width:0}
.mname{font-size:17px;font-weight:800}
.mk{text-align:right;font-size:12px;color:var(--muted);white-space:nowrap}
.mk .num{display:block;font-size:17px;color:var(--ink);font-weight:700}
.vchips{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 8px}
.vchip{appearance:none;border:1px solid var(--line);background:var(--raise);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted)}
.vchip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.items{list-style:none;margin:0;padding:0}
.item{appearance:none;width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;cursor:pointer}
.item:active{background:var(--raise)}
.item .w{min-width:0}
.item .h{display:block;font-size:12px;color:var(--muted)}
.item .g{white-space:nowrap;font-weight:700;display:flex;align-items:center;gap:6px}
.item .g::after{content:"›";color:var(--muted);font-family:var(--f-text);font-size:18px;line-height:1}
.mfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:3px 8px;border-radius:99px;background:var(--raise);color:var(--muted)}
.chip.p{background:var(--protein-soft);color:var(--protein);font-weight:700}
.acts{display:flex;gap:6px;flex-wrap:wrap}

/* Buttons */
.btn{appearance:none;border:1px solid var(--line);background:var(--raise);border-radius:99px;padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft);background:var(--bad-soft)}
.btn.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.btn.small{padding:5px 11px;font-size:13px;min-height:32px}
.btn.block{width:100%}
.btn.ghost{background:transparent}

/* Lists */
.list{display:flex;flex-direction:column}
.row{appearance:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;width:100%;cursor:pointer}
.row:first-child{border-top:0}
.row .w{min-width:0}
.row .n{font-weight:700;display:block;overflow-wrap:anywhere}
.row .h{display:block;font-size:12px;color:var(--muted)}
.row .r{text-align:right;white-space:nowrap;font-size:13px}

/* Forms */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.field input,.field select,.field textarea{appearance:none;width:100%;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--raise);color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{appearance:none;border:0;background:transparent;border-radius:9px;padding:8px 4px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px var(--shade)}
.note{font-size:13px;color:var(--muted)}
.note b{color:var(--ink)}
.hint{font-size:13px;padding:10px 12px;border-radius:12px;background:var(--raise);color:var(--muted)}
.hint.warn{background:var(--warn-soft);color:var(--warn)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--raise);border-radius:12px;padding:10px 12px;min-width:0}
.stat .l{font-size:12px;color:var(--muted);font-weight:600}
.stat .v{font-size:20px;font-weight:700}
.stat.hl{background:var(--accent-soft)} .stat.hl .v{color:var(--accent)}

/* Stepper */
.stepper{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:center}
.stepper input{text-align:center;font-family:var(--f-num);font-size:22px;font-weight:700}

/* Options */
.opt{appearance:none;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.opt:active{border-color:var(--accent)}
.opt .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.opt .ttl{font-weight:800}
.opt .gr{font-size:20px;font-weight:700;color:var(--accent);white-space:nowrap}
.opt .res{font-size:12px;color:var(--muted)}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs .in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.dg{width:78px;font:inherit;font-size:16px;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--raise);color:var(--ink);text-align:right;font-family:var(--f-num)}
.ingr{display:flex;align-items:center;gap:6px;flex:none}
.fitg{font-size:17px;font-weight:700;color:var(--accent);white-space:nowrap}
.tab{appearance:none;border:0;background:transparent;border-radius:12px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}

/* Sheet */
.sheetwrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheetwrap[hidden]{display:none}
.shade{position:absolute;inset:0;background:var(--shade)}
.sheet{position:relative;width:100%;max-width:540px;max-height:88%;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;
  padding-top:10px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
.grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:0 auto}
.shead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{appearance:none;border:0;background:var(--raise);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;flex:none}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.empty{text-align:center;color:var(--muted);padding:12px 0}
.rec{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.rec:first-of-type{border-top:0}
.rec .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.rec .n{font-weight:700;overflow-wrap:anywhere}
.rec .why{font-size:13px;color:var(--muted)}
.rec .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--raise);color:var(--muted)}
.tag.on{background:var(--accent-soft);color:var(--accent)}
.grp{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}

/* Тренировки */
.modesw{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--raise);border:1px solid var(--line);border-radius:14px;padding:3px}
.modesw button{appearance:none;border:0;background:transparent;border-radius:11px;padding:9px 6px;font-weight:800;font-size:14px;color:var(--muted);cursor:pointer}
.modesw button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sethead{display:grid;grid-template-columns:28px 1fr 1fr 48px;gap:8px;padding:6px 16px 0;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.setrow{display:grid;grid-template-columns:28px 1fr 1fr 48px;gap:8px;align-items:center;padding:5px 16px}
.setrow .no{font-family:var(--f-num);color:var(--muted);text-align:center;font-weight:700}
.setrow input{width:100%;min-width:0;font:inherit;font-family:var(--f-num);font-size:16px;padding:8px 6px;border-radius:10px;border:1px solid var(--line);background:var(--raise);color:var(--ink);text-align:center}
.setrow.done input{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.chk{appearance:none;width:48px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--raise);font-size:18px;font-weight:800;cursor:pointer;color:var(--muted)}
.setrow.done .chk{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.sug{font-size:12px;font-weight:700;color:var(--accent);padding:0 16px}
.sug.up{color:var(--ok)}
.last{font-size:12px;color:var(--muted);padding:0 16px}
.exfoot{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px 14px}
.restbar{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;justify-content:center;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.restbar .in{pointer-events:auto;max-width:516px;width:100%;background:var(--ink);color:var(--bg);border-radius:16px;padding:8px 10px 8px 14px;display:flex;align-items:center;gap:6px;box-shadow:0 6px 20px var(--shade)}
.restbar .lbl{font-size:11px;opacity:.75;font-weight:700;display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.restbar .clk{font-family:var(--f-num);font-size:22px;font-weight:700}
.restbar .grow{flex:1;min-width:0}
.restbar button{appearance:none;border:0;background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 10px;font-weight:800;font-size:13px;cursor:pointer}
.restbar.over .in{background:var(--ok);color:var(--surface)}
.restbar .prog{height:4px;border-radius:99px;background:rgba(127,127,127,.35);margin-top:4px;overflow:hidden}
.restbar .prog i{display:block;height:100%;background:var(--accent-soft)}
.bigclock{font-family:var(--f-num);font-size:15px;font-weight:700;color:var(--accent)}
.exed{display:grid;grid-template-columns:1fr 52px 64px 64px;gap:6px;align-items:end;padding:10px 0;border-top:1px solid var(--line)}
.exed:first-child{border-top:0}
.exed .nm{grid-column:1/-1;display:flex;gap:6px;align-items:center}
.exed .nm input{flex:1}
.exed input,.exed select,.wsel{width:100%;min-width:0;font:inherit;font-size:16px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--raise);color:var(--ink)}
.exed label{font-size:11px;color:var(--muted);font-weight:700;display:block;margin-bottom:3px}
.mini{appearance:none;border:1px solid var(--line);background:var(--raise);border-radius:9px;width:36px;height:36px;font-size:15px;cursor:pointer;flex:none;color:var(--ink)}
.wrow{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;padding:4px 0}
.wrow b{font-weight:800}
.chart{width:100%;height:auto;display:block}

/* Не приближать экран при двойном нажатии (щипок для увеличения остаётся) */
html,body,*{touch-action:manipulation}
</style>
<style>
html,body{margin:0}
html{-webkit-text-size-adjust:100%;color-scheme:light}
@media (prefers-color-scheme: dark){html{color-scheme:dark}}
body{font-size:15px;padding-top:env(safe-area-inset-top,0px);min-height:100vh}
[hidden]{display:none!important}
img{max-width:100%}
</style>
</head>

<div class="wrap" id="view"></div>

<nav class="tabs" aria-label="Разделы"><div class="in" id="tabsIn"></div></nav>

  <div class="shade" data-act="close"></div>
  <div class="sheet" role="dialog" aria-modal="true" id="sheetBody"></div>
</div>

  products:[

    {id:"ham",name:"Ветчина Dulano",kcal:112,p:20,f:3,c:1},
    {id:"rice",name:"Рис жасмин (сухой)",kcal:352,p:7.6,f:1.1,c:77.3},
    {id:"penne",name:"Пенне (сухие)",kcal:359,p:12,f:1.9,c:72},
    {id:"tuna",name:"Тунец (без жидкости)",kcal:118,p:28,f:0.8,c:0,pieceG:150,pieceName:"банка"},
    {id:"veg",name:"Овощи замороженные",kcal:30,p:2,f:0.3,c:4},
    {id:"oil",name:"Масло растительное",kcal:900,p:0,f:100,c:0,pieceG:5,pieceName:"ч. л."}

let ROOT=null, dbRef=null, saving=false, again=false, timer=null, syncState="local";
function fix(s){ // защитить от неполных или старых данных
  const d=clone(DEFAULT); if(!s||typeof s!=="object") return d;
  const p=s.profile||{};
  if(p.steps===undefined){ // старый формат: был только коэффициент активности
    p.steps=5000; p.trainings=3; p.trainMin=60; p.pace=0.5;
  }
  s.profile=Object.assign(d.profile,p);
  if(!Array.isArray(s.products)) s.products=d.products;
  if(!Array.isArray(s.slots)||!s.slots.length) s.slots=d.slots;
  if(!Array.isArray(s.schedule)||s.schedule.length!==7) s.schedule=d.schedule;
  if(!s.eaten) s.eaten={date:"",done:[]};

  if(!s.train.step) s.train.step=2.5;
  s.v=1; return s;
}
function wrap(state,name){const id="a"+Date.now().toString(36); return {v:2,active:id,updatedAt:0,accounts:{[id]:{name:name||"Основной",state:fix(state)}}}}
function fixRoot(r){
  if(!r||typeof r!=="object") return wrap(clone(DEFAULT));
  if(r.v!==2) return wrap(r);
  if(!r.accounts||!Object.keys(r.accounts).length) return wrap(clone(DEFAULT));
  Object.values(r.accounts).forEach(a=>{a.state=fix(a.state); if(!a.name) a.name="Аккаунт"});
  if(!r.accounts[r.active]) r.active=Object.keys(r.accounts)[0];
  r.updatedAt=r.updatedAt||0; return r;
}

}

async function flush(){
  if(!dbRef) return; if(saving){again=true;return}
  if(navigator.onLine===false){setSync("offline"); return}
  saving=true; setSync("saving");
  try{await dbRef.set(clone(ROOT)); setSync("saved")}catch(e){setSync(navigator.onLine===false?"offline":"error")}
  saving=false; if(again){again=false; flush()}
}
window.addEventListener("online",()=>flush());

async function connect(){
  try{
    if(!window.claude||!window.claude.use) return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    dbRef=db.doc("data/users/"+id+"/state");
    const snap=await dbRef.get();
    const remote=snap.exists?snap.data():null;
    const r=remote?fixRoot(clone(remote)):null;
    if(r&&(r.updatedAt||0)>=(ROOT.updatedAt||0)){useRoot(r); saveLocal(); render(); setSync("saved")}
    else {await dbRef.set(clone(ROOT)); setSync("saved")}
  }catch(e){ if(dbRef) setSync(navigator.onLine===false?"offline":"error") }
}

function targets(){
  const p=S.profile, w=num(p.weight), h=num(p.height), a=num(p.age), bf=num(p.bf);
  const mif=10*w+6.25*h-5*a+(p.sex==="f"?-161:5);
  const lbm=bf>3&&bf<60?w*(1-bf/100):0;
  const katch=lbm?370+21.6*lbm:0;
  const bmr=katch?(mif+katch)/2:mif;               // при известном % жира берём среднее двух формул
  const tef=bmr*0.1;                               // переваривание пищи + минимальные бытовые движения
  const stepsK=num(p.steps)*0.04*(w/70);           // ходьба: ~0,04 ккал на шаг для 70 кг
  const trainK=num(p.trainings)*num(p.trainMin)*((5-1)*3.5*w/200)/7; // силовая ~5 MET, в среднем на день
  const tdee=bmr+tef+stepsK+trainK;
  const pace=num(p.pace)||0.5;
  const auto=p.goal==="cut"?tdee-w*pace/100*7700/7:p.goal==="bulk"?tdee+w*0.25/100*7700/7:tdee;
  const kcal=num(p.manualKcal)>0?num(p.manualKcal):auto;
  const prot=w*num(p.pPerKg), fat=w*num(p.fPerKg), carb=Math.max(0,(kcal-prot*4-fat*9)/4);
  return {mif,katch,lbm,bmr,tef,stepsK,trainK,tdee,auto,kcal,p:prot,f:fat,c:carb,fLimit:fat+15};
}
function daysUsing(slotI,vi){const s=S.slots[slotI];return WD.filter((_,d)=>vIdx(s,d)===vi)}
function hintFor(it){
  const p=P(it.pid); if(!p||!p.pieceG) return "";
  const x=it.g/p.pieceG, name=esc(p.pieceName||"шт"), pg=String(p.pieceG).replace(".",",");
  if(x<0.97){
    const fr=[[1/8,"1/8"],[1/4,"1/4"],[1/3,"1/3"],[1/2,"1/2"],[2/3,"2/3"],[3/4,"3/4"]].find(([v])=>Math.abs(x-v)<0.03);
    const t=fr?fr[1]:String(Math.round(x*10)/10||0.1).replace(".",",");
    return `≈ ${t} · 1 ${name} = ${pg} г`;
  }
  const n=p.pieceG<=60?Math.round(x*2)/2:Math.round(x*10)/10;
  return "≈ "+String(n).replace(".",",")+" "+name;
}
function kcalState(v,t){const d=v-t; if(Math.abs(d)<=t*0.03) return ["ok","в цели"]; if(d>0) return [d>t*0.08?"bad":"warn","+"+r(d)+" ккал"]; return [d<-t*0.08?"bad":"warn",r(d)+" ккал"]}

let editDish=null, dfit={si:3,mode:"side",d:null};
function isSide(it){const p=P(it.pid); return !!p&&p.c>5&&p.c*4>=p.p*4&&p.c*4>=p.f*9}
function fitDish(items,si,d,mode){
  const T=targets(), slot=S.slots[si];
  const cur=sumItems(variantOf(slot,d).items), base=dayTotal(d).map((v,k)=>v-cur[k]);
  const room=T.kcal-base[0], tot=sumItems(items);
  const side=items.filter(isSide), sideK=sumItems(side)[0], restK=tot[0]-sideK;
  let out, bad="";
  if(room<=50) bad="На этот приём в этот день почти не осталось калорий. Выберите другой приём или день.";
  if(mode==="side"&&side.length&&room-restK>sideK*0.2){const k=(room-restK)/sideK; out=items.map(it=>({pid:it.pid,g:isSide(it)?r5(it.g*k):r(it.g)}))}
  else {
    if(mode==="side"&&!bad) bad=side.length?"Не влезает даже с маленьким гарниром, поэтому уменьшено всё пропорционально.":"В блюде нет гарнира (крупа, картошка, хлеб), поэтому порция изменена пропорционально.";
    const k=tot[0]>0?Math.max(0,room)/tot[0]:0; out=items.map(it=>({pid:it.pid,g:r5(it.g*k)}));
  }
  const m=sumItems(out); return {items:out,m,res:add(base,m),room,bad};
}

  const ds=editDish; if(!ds.items.length) return `<div class="note">Добавьте хотя бы один продукт, и здесь появится расчёт.</div>`;

function dishQuality(m){
  const dens=m[0]>0?m[1]/m[0]*100:0;
  if(dens>=8) return ["ok","белковое","Много белка на калорию, хорошо для сушки."];
  if(dens>=5) return ["warn","средне по белку","Нормально, но на сушке лучше больше белковой части или меньше гарнира."];
  return ["bad","мало белка","В основном калории. На сушке ешьте его небольшой порцией или добавьте белок."];
}

/* ---------- Моё блюдо в день: анализ, куда и как влезает ---------- */
function dishSlots(ds,d){
  const tot=sumItems(ds.items)[0], T=targets();
  return S.slots.map((s,si)=>{const f=fitDish(ds.items,si,d,"side"); const ratio=tot>0?f.m[0]/tot:0;
    const score=Math.abs(1-Math.min(ratio,1.15))*100+Math.max(0,f.res[2]-T.fLimit)*2+Math.max(0,T.p*0.9-f.res[1])*2;
    return {si,f,ratio,score}}).sort((a,b)=>a.score-b.score);
}
function ratioText(x){if(x>=0.97&&x<=1.05) return ["ok","полная порция"]; if(x>1.05) return ["ok","можно даже больше: +"+r((x-1)*100)+"%"]; return [x>=0.8?"warn":"bad","порция "+r(x*100)+"% от задуманной"]}

function sheetDishInDay(id){
  const ds=S.dishes.find(x=>x.id===id); if(!ds) return; ctx={dish:id};
  const d=selDay, T=targets(), tot=sumItems(ds.items), opts=dishSlots(ds,d); ctx.opts=opts;
  const best=opts[0];
  let alt="";
  if(best.ratio<0.9){
    const others=[];
    for(let dd=0;dd<7;dd++){if(dd===d) continue; const o=dishSlots(ds,dd)[0]; if(o.ratio>=best.ratio+0.08) others.push([dd,o])}
    others.sort((a,b)=>b[1].ratio-a[1].ratio);
    alt=`<div class="hint warn">В ${WDF[d]} полная порция (${r(tot[0])} ккал) не влезает ни в один приём. ${others.length?"Больше порция выйдет: "+others.slice(0,3).map(([dd,o])=>`${WD[dd]} (${S.slots[o.si].name.toLowerCase()}, ${r(o.ratio*100)}%)`).join(", ")+".":"В другие дни примерно так же."} Можно взять уменьшенную порцию или полную с заменой чего-то ещё.</div>
    <button class="btn block" data-act="mdfull">Съесть полную порцию и выбрать, что убрать</button>`;
  } else alt=`<div class="hint">Влезает. Лучше всего вместо: <b>${esc(S.slots[best.si].name.toLowerCase())}</b>.</div>`;
  const cards=opts.map((o,i)=>{const s=S.slots[o.si], rt=ratioText(o.ratio);
    return `<button class="opt${i===0?" cur":""}" data-act="mdput" data-i="${i}"><span class="top"><span class="ttl">Вместо: ${esc(s.name.toLowerCase())}</span><span class="gr num" style="font-size:16px">${r(o.f.m[0])} ккал</span></span><span class="res">Сейчас там «${esc(variantOf(s,d).name)}»</span><span class="ing">${esc(o.f.items.map(it=>(P(it.pid)?.name||"?").split(" (")[0]+" "+r(it.g)+" г").join(" · "))}</span><span class="res">День: <span class="num">${r(o.f.res[0])}</span> ккал, белок <span class="num">${r(o.f.res[1])}</span> г, жиры <span class="num">${r(o.f.res[2])}</span> г</span><span><span class="pill ${rt[0]}">${rt[1]}</span> ${verdict(o.f.res,T)}</span></button>`}).join("");
  openSheet(esc(ds.name),`<div class="chips">${macChips(tot)}</div>${alt}<div class="grp">Куда поставить (${WDF[d]})</div>${cards}
    <div class="note">Граммы подогнаны меняя гарнир (крупа, картошка, хлеб). Изменение только для этого дня, вернуть можно кнопкой «Вернуть стандартный день».</div>
    <button class="btn ghost block" data-act="mydish">← Другое блюдо</button>`);
}
function placeDish(ds,si,items,d,allWeek){
  const s=S.slots[si], name=allWeek?ds.name:ds.name+" · "+WD[d];
  let vi=s.variants.findIndex(v=>v.dish===ds.id&&v.name===name);
  if(vi<0){s.variants.push({name,dish:ds.id,items:clone(items)}); vi=s.variants.length-1} else s.variants[vi].items=clone(items);
  if(allWeek) S.schedule.forEach(day=>day[s.key]=vi); else S.schedule[d][s.key]=vi;
  return si;
}

  const s=S.slots[ctx.s], d=selDay, T=targets(), cur=vIdx(s,d);
  const base=dayTotal(d).map((v,k)=>v-sumItems(variantOf(s,d).items)[k]);
  const card=(act,attrs,name,m,ingr,tip,buy,isCur)=>{const res=add(base,m);
    return `<button class="opt${isCur?" cur":""}" data-act="${act}" ${attrs}><span class="top"><span class="ttl">${esc(name)}</span><span class="gr num" style="font-size:16px">${r(m[0])} ккал</span></span><span class="ing">${esc(ingr)}</span>${tip?`<span class="res">${esc(tip)}</span>`:""}${buy?`<span class="buy">Нужно купить: ${esc(buy)}</span>`:""}<span class="res">Белок ${r(m[1])} г. День с ним: <span class="num">${r(res[0])}</span> ккал, белок <span class="num">${r(res[1])}</span> г</span><span>${isCur?`<span class="pill neutral">сейчас</span> `:""}${verdict(res,T)}</span></button>`};
  const ingrOf=items=>items.map(([n,g])=>`${n.split(" (")[0]} ${r(g)} г`).join(" · ");
  const mine=s.variants.map((v,i)=>card("choosev",`data-v="${i}"`,v.name,sumItems(v.items),ingrOf(v.items.map(it=>[P(it.pid)?.name||"?",it.g])),"","",i===cur)).join("");
  const recs=(RECIPES[s.key]||[]).filter(rec=>!s.variants.some(v=>v.recipe===rec.id)).map(rec=>card("chooser",`data-r="${rec.id}"`,rec.name,recMac(rec),ingrOf(rec.items.map(([cid,g])=>[srcOf(cid)?.name||"?",g])),rec.tip,recMissing(rec).join(", "),false)).join("");
  openSheet(esc(s.name)+": что съесть",`
    <div class="seg"><button data-act="chonly" data-v="1" aria-pressed="${ctx.onlyDay!==false}">Только ${WDF[d]}</button><button data-act="chonly" data-v="0" aria-pressed="${ctx.onlyDay===false}">На всю неделю</button></div>
    <div class="grp">Мои варианты</div>${mine}
    ${S.dishes.length?`<div class="grp">Мои блюда (граммы подогнаны)</div>${S.dishes.map(ds=>{const f=fitDish(ds.items,ctx.s,d,"side"); return card("choosed",`data-id="${esc(ds.id)}"`,ds.name,f.m,ingrOf(f.items.map(it=>[P(it.pid)?.name||"?",it.g])),f.bad||"Порция подогнана под этот приём.","",false)}).join("")}`:""}
    ${recs?`<div class="grp">Новые идеи под сушку</div>${recs}`:""}
    <button class="btn ghost block" data-act="variants" data-s="${ctx.s}">Настроить варианты (переименовать, копия, удалить)</button>`);
}

function recMacros(goal){return goal==="cut"?{p:2.0,f:0.7}:goal==="bulk"?{p:1.8,f:0.9}:{p:1.8,f:0.8}}
function goalRes(){
  const T=targets(), p=S.profile, w=num(p.weight);
  const weekly=(T.tdee-T.kcal)*7/7700;
  let eta="";
  if(p.goal==="cut"&&weekly>0.05&&num(p.bf)>num(p.targetBf)&&num(p.targetBf)>0){
    const lean=w*(1-num(p.bf)/100), tw=lean/(1-num(p.targetBf)/100), lose=w-tw, weeks=lose/weekly;
    eta=`<div class="hint">До ${String(p.targetBf).replace(".",",")}% жира: вес около <b class="num">${(Math.round(tw*10)/10+"").replace(".",",")} кг</b>, сбросить ~${(Math.round(lose*10)/10+"").replace(".",",")} кг. Это около <b class="num">${Math.ceil(weeks)}</b> недель.</div>`;
  }
  const rec=recMacros(p.goal);
  const avg=[0,1,2,3,4,5,6].reduce((a,d)=>add(a,dayTotal(d)),Z()).map(x=>x/7);
  const fatLow=num(p.fPerKg)<0.6;
  const row=(l,v,h)=>`<div class="row" style="cursor:default;padding:8px 0"><span class="w"><span class="n" style="font-weight:600">${l}</span>${h?`<span class="h">${h}</span>`:""}</span><span class="r num">${v}</span></div>`;
  return `<h2>Расчёт</h2>
  <div class="list">
    ${row("Обмен в покое",r(T.bmr),T.katch?`среднее Миффлина-Сан Жеора (${r(T.mif)}) и Кэтча-Макардла по сухой массе (${r(T.katch)})`:"формула Миффлина-Сан Жеора; впишите % жира для точности")}
    ${row("Переваривание и быт","+"+r(T.tef),"≈10% от обмена")}
    ${row("Шаги","+"+r(T.stepsK),`${esc(p.steps)} шагов в день`)}
    ${row("Тренировки","+"+r(T.trainK),`${esc(p.trainings)} × ${esc(p.trainMin)} мин в неделю, в среднем на день`)}
    ${row("<b>Поддержание веса</b>",`<b>${r(T.tdee)}</b>`,"")}
  </div>
  <div class="stats">
    <div class="stat hl"><div class="l">Цель, ккал${num(p.manualKcal)>0?" (своя)":""}</div><div class="v num">${r(T.kcal)}</div></div>
    <div class="stat"><div class="l">${weekly>=0?"Минус":"Плюс"} в неделю</div><div class="v num">${(Math.round(Math.abs(weekly)*100)/100+"").replace(".",",")} кг</div></div>
    <div class="stat"><div class="l">Белок</div><div class="v num" style="color:var(--protein)">${r(T.p)} г</div></div>
    <div class="stat"><div class="l">Жиры / Углев.</div><div class="v num">${r(T.f)} / ${r(T.c)}</div></div>
  </div>
  ${num(p.manualKcal)>0?`<div class="note">Стоит своя норма. Автоматический расчёт для выбранного темпа: <b class="num">${r(T.auto)}</b> ккал.</div>`:""}
  ${fatLow?`<div class="hint warn">Жиров меньше 0,6 г на кг. Для гормонов на долгой сушке лучше 0,6-0,8 г/кг (рекомендуемо: ${rec.f}).</div>`:""}
  ${eta}
  <div class="note">Рацион сейчас в среднем: <b class="num">${r(avg[0])}</b> ккал, белок <b class="num">${r(avg[1])}</b> г. Расчёт ориентировочный: через 2 недели сверьтесь с весами и поправьте норму.</div>`;
}

const STANDALONE=!!window.__STANDALONE__;
function exportText(){return JSON.stringify({app:"moy-racion",v:2,exportedAt:new Date().toISOString(),root:ROOT})}
function backupCard(){
  return `<section class="card"><h2>Резервная копия и перенос</h2>
    <div class="note">${STANDALONE?"Скопируйте или скачайте данные, чтобы сохранить их или перенести на другое устройство.":"Чтобы перенести всё в версию без Claude: нажмите «Скопировать данные», откройте ту версию, вкладка «Аккаунт», вставьте и нажмите «Загрузить»."}</div>
    <div class="grid2" style="grid-template-columns:${STANDALONE?"1fr 1fr":"1fr"}"><button class="btn primary block" data-act="bkcopy">Скопировать данные</button>${STANDALONE?`<button class="btn block" data-act="bkfile">Скачать файл</button>`:""}</div>
    <div id="bkOutBox"></div>
    <div class="field"><label for="bkIn">Вставить данные из другой версии или копии</label><textarea id="bkIn" rows="3" placeholder="Вставьте сюда скопированный текст"></textarea></div>

    <div id="bkMsg"></div></section>`;
}
function bkCheck(text){
  try{const o=JSON.parse(text), r=o&&o.root?o.root:o; if(!r||typeof r!=="object"||(!r.accounts&&!r.profile)) throw 0; return r}catch(e){return null}
}
function bkAsk(text){
  const r=bkCheck(text), m=document.getElementById("bkMsg");
  if(!r){m.innerHTML=`<div class="hint warn">Не похоже на данные приложения. Скопируйте текст целиком ещё раз.</div>`; return}
  const n=r.accounts?Object.keys(r.accounts).length:1;
  ctx.bkData=r;
  m.innerHTML=`<div class="hint warn">Загрузить ${n} ${n===1?"аккаунт":"аккаунта(ов)"}? Всё, что сейчас в этой версии, заменится.</div><button class="btn danger block" data-act="bkok">Да, заменить</button>`;
}

function verdict(res,T){
  const out=[]; const [st,txt]=kcalState(res[0],T.kcal);
  out.push(`<span class="pill ${st}">${txt}</span>`);
  out.push(res[1]>=T.p*0.9?`<span class="pill ok">белок ок</span>`:`<span class="pill warn">белка −${r(T.p-res[1])} г</span>`);
  if(res[2]>T.fLimit) out.push(`<span class="pill warn">жиры +${r(res[2]-T.f)} г</span>`);
  return out.join(" ");
}
function sheetOptions(pid){
  ctx.pid=pid; const np=P(pid), T=targets(), day=dayTotal(selDay);
  const opts=[];
  if(ctx.mode==="swap"){
    const old=curVariant().items[ctx.i], om=mac(old), base=day.map((v,k)=>v-om[k]);
    if(np.kcal>0) opts.push(["Столько же калорий",r5(om[0]/np.kcal*100),"день останется в тех же калориях"]);
    if(np.p>=3&&om[1]>=3) opts.push(["Столько же белка",r5(om[1]/np.p*100),"белок за день не изменится"]);
    const fit=(T.kcal-base[0])/np.kcal*100; if(np.kcal>0&&fit>=5) opts.push(["Подогнать день под цель",r5(fit),"калории дня станут ровно по цели"]);
    ctx.base=base;
  } else {
    const rem=(T.kcal-day[0])/np.kcal*100;
    const fatRoom=np.f>0?(T.fLimit-day[2])/np.f*100:Infinity;
    const g=Math.min(rem,fatRoom);
    if(np.kcal>0&&g>=5) opts.push(["Закрыть остаток дня",r5(g),"сколько влезает в цель"]);
    ctx.base=day;
  }
  const seen=new Set(); const uniq=opts.filter(o=>!seen.has(o[1])&&seen.add(o[1]));
  const card=([ttl,g,why])=>{const m=[np.kcal,np.p,np.f,np.c].map(x=>x*g/100), res=add(ctx.base,m);

function slotGuess(){
  let key="dinner";
  if(selDay===todayIdx){const h=new Date().getHours(); key=h<11?"breakfast":h<15?"lunch":h<18?"snack":"dinner"}
  const i=S.slots.findIndex(s=>s.key===key); return i<0?S.slots.length-1:i;

function ownVariant(si,d){
  const s=S.slots[si], vi=vIdx(s,d);
  if(!ctx.onlyDay) return s.variants[vi];
  if(DAYTAG.test(s.variants[vi].name)&&daysUsing(si,vi).length<=1) return s.variants[vi];
  const v=clone(s.variants[vi]); v.name=s.variants[vi].name.replace(/ · (Пн|Вт|Ср|Чт|Пт|Сб|Вс)$/,"")+" · "+WD[d];
  s.variants.push(v); S.schedule[d][s.key]=s.variants.length-1; return v;
}
function pendMac(){if(!ctx.pend) return Z(); const p=P(ctx.pend.pid); return [p.kcal,p.p,p.f,p.c].map(x=>x*ctx.pend.g/100)}
function fixes(d){
  const T=targets(), base=add(dayTotal(d),pendMac()), excess=base[0]-T.kcal;
  if(excess<=T.kcal*0.03) return [];
  const out=[];
  S.slots.forEach((s,si)=>variantOf(s,d).items.forEach((it,ii)=>{
    const p=P(it.pid); if(!p||p.kcal<=0) return;
    if(ctx.protect&&si===ctx.protect.si&&(ctx.protect.pid==null||it.pid===ctx.protect.pid)) return;
    const m=mac(it), where=s.name.toLowerCase();
    if(m[0]>=20) out.push({si,ii,g:0,res:base.map((v,k)=>v-m[k]),text:`Убрать ${p.name}, ${r(it.g)} г (${where})`});
    const need=excess/p.kcal*100, ng=r5(it.g-need);
    if(need>=5&&ng>=5&&ng<it.g){const dm=[p.kcal,p.p,p.f,p.c].map(x=>x*(it.g-ng)/100); out.push({si,ii,g:ng,res:base.map((v,k)=>v-dm[k]),text:`${p.name} (${where}): ${r(it.g)} → ${ng} г`})}
  }));
  S.slots.forEach((s,si)=>{const v=variantOf(s,d); if(v.items.length<2) return; if(ctx.protect&&si===ctx.protect.si) return;
    const m=sumItems(v.items); out.push({si,ii:-1,g:0,res:base.map((x,k)=>x-m[k]),text:`Убрать весь ${s.name.toLowerCase()} (${v.items.map(it=>P(it.pid)?.name.split(" ")[0]).join(", ")})`})});
  out.forEach(o=>{const x=o.res, it=o.ii>=0?variantOf(S.slots[o.si],d).items[o.ii]:null;
    o.score=Math.abs(x[0]-T.kcal)+Math.max(0,T.p*0.9-x[1])*8+Math.max(0,x[2]-T.fLimit)*9+(o.g===0?20:0)+(it&&o.g>0&&o.g<it.g*0.4?60:0)});
  return out.sort((a,b)=>a.score-b.score).slice(0,5);
}
function fixCards(fx,act,T){return fx.map((o,i)=>`<button class="opt" data-act="${act}" data-fix="${i}"><span class="ttl">${esc(o.text)}</span><span class="res">День: <span class="num">${r(o.res[0])}</span> ккал, белок <span class="num">${r(o.res[1])}</span> г, жиры <span class="num">${r(o.res[2])}</span> г</span><span>${verdict(o.res,T)}</span></button>`).join("")}

/* ---------- Автоподгонка дня: меняем граммы в других приёмах ---------- */
function dayIssues(d){
  const T=targets(), t=dayTotal(d), out=[];
  if(Math.abs(t[0]-T.kcal)>T.kcal*0.03) out.push("kcal");
  if(t[2]>T.fLimit) out.push("fat");
  if(t[1]<T.p*0.9) out.push("prot");
  if(t[3]>T.c+30) out.push("carb");
  return out;
}
function balanceDay(d,lock){
  const T=targets(), items=[];
  S.slots.forEach((s,si)=>variantOf(s,d).items.forEach((it,ii)=>{const p=P(it.pid); if(!p) return;
    const locked=lock.slots.has(si)||(lock.item&&lock.item.si===si&&lock.item.pid===it.pid);
    items.push({si,ii,pid:it.pid,g0:it.g,g:it.g,u:[p.kcal,p.p,p.f,p.c].map(x=>x/100),locked})}));
  const tot=()=>items.reduce((a,x)=>a.map((v,k)=>v+x.u[k]*x.g),[0,0,0,0]);
  const cost=()=>{const t=tot();
    const ek=(t[0]-T.kcal)/(T.kcal*0.025), ef=Math.max(0,t[2]-T.f)/4, efl=Math.max(0,T.f*0.6-t[2])/5,
          ep=Math.max(0,T.p*0.95-t[1])/4, ec=Math.max(0,t[3]-T.c)/15;
    let ch=0; for(const x of items){if(x.locked) continue; const rel=(x.g-x.g0)/Math.max(x.g0,20); ch+=rel*rel*0.6+(x.g===0&&x.g0>0?0.4:0)}
    return ek*ek+ef*ef+efl*efl+ep*ep+ec*ec*0.5+ch};
  let cur=cost();
  for(let n=0;n<400;n++){
    let best=null;
    for(const x of items){ if(x.locked) continue;
      const st=Math.max(5,r5(x.g0*0.1));
      for(const ng of [x.g-st,x.g+st,0]){ if(ng<0||ng>x.g0*1.6+10||ng===x.g) continue;
        const old=x.g; x.g=ng; const c=cost(); x.g=old; if(c<cur-1e-6&&(!best||c<best.c)) best={set:[[x,ng]],c} } }
    S.slots.forEach((s,si)=>{const xs=items.filter(x=>x.si===si&&!x.locked&&x.g>0); if(xs.length<2||items.some(x=>x.si===si&&x.locked)) return;
      const olds=xs.map(x=>x.g); xs.forEach(x=>x.g=0); const c=cost(); xs.forEach((x,i)=>x.g=olds[i]);
      if(c<cur-1e-6&&(!best||c<best.c)) best={set:xs.map(x=>[x,0]),c}});
    if(!best) break; best.set.forEach(([x,g])=>x.g=g); cur=best.c;
  }
  return {items,tot:tot()};
}
function balChanges(items){
  const out=[];
  S.slots.forEach((s,si)=>{const xs=items.filter(x=>x.si===si); const changed=xs.filter(x=>Math.abs(x.g-x.g0)>0.01); if(!changed.length) return;
    if(xs.every(x=>x.g===0)){const k=xs.reduce((a,x)=>a+x.u[0]*x.g0,0); out.push(`Пропустить ${s.name.toLowerCase()} (${r(k)} ккал)`); return}
    changed.forEach(x=>{const n=(P(x.pid)?.name||"?").split(" (")[0]; out.push(x.g===0?`Убрать ${n} из «${s.name.toLowerCase()}»`:`${n} (${s.name.toLowerCase()}): ${r(x.g0)} → ${r(x.g)} г`)})});
  return out;
}

function stdIdx(s,d){const i=(DEFAULT.schedule[d]||{})[s.key]||0; const v=s.variants.findIndex((x,j)=>j>=i&&!DAYTAG.test(x.name)); return v<0?0:Math.min(i,s.variants.length-1)}

const TR=()=>S.train;
const exKey=n=>String(n||"").trim().toLowerCase().replace(/ё/g,"е");
const fmtW=w=>String(Math.round(num(w)*100)/100).replace(".",",");
const fmtDur=ms=>{const t=Math.max(0,Math.floor(ms/1000)),h=Math.floor(t/3600),m=Math.floor(t%3600/60),sec=t%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(sec).padStart(2,"0")};

function parseReps(rp){const m=String(rp).match(/(\d+)\s*[-–]\s*(\d+)/); if(m) return [+m[1],+m[2]]; const n=parseInt(rp)||10; return [n,n]}
function dayById(id){return TR().days.find(d=>d.id===id)}
function lastFor(name){
  const k=exKey(name), ss=TR().sessions;
  for(let i=ss.length-1;i>=0;i--){const e=ss[i].ex.find(x=>exKey(x.name)===k&&x.sets.some(st=>st.done)); if(e) return {s:ss[i],e}}
  return null;
}
function suggest(plan,last){
  const step=num(TR().step)||2.5;
  if(!last) return {w:null,text:"Первый раз: возьмите вес, с которым последние 1-2 повтора даются тяжело."};
  const done=last.e.sets.filter(x=>x.done); const [lo,hi]=parseReps(plan.reps);
  const wMax=Math.max(...done.map(x=>num(x.w))); const top=done.filter(x=>num(x.w)===wMax);
  if(done.length>=num(plan.sets)&&top.every(x=>num(x.reps)>=hi)) return {w:wMax+step,up:true,text:`Прошлый раз все подходы по ${hi}+. Пробуйте ${fmtW(wMax+step)} кг.`};
  if(top.some(x=>num(x.reps)<lo)) return {w:wMax,text:`Прошлый раз не добрали до ${lo}. Оставьте ${fmtW(wMax)} кг.`};
  return {w:wMax,text:`Тот же вес ${fmtW(wMax)} кг, добавьте по повтору.`};
}
function lastLine(last){if(!last) return ""; const d=new Date(last.s.start);
  return `Прошлый раз (${d.toLocaleDateString("ru-RU",{day:"numeric",month:"short"})}): `+last.e.sets.filter(x=>x.done).map(x=>`${fmtW(x.w)}×${x.reps}`).join(", ")}
function mkSessEx(plan){
  const last=lastFor(plan.name), sg=suggest(plan,last), [lo]=parseReps(plan.reps);
  const lastDone=last?last.e.sets.filter(x=>x.done):[];
  return {exId:plan.id,name:plan.name,reps:plan.reps,rest:num(plan.rest)||90,target:`${plan.sets}×${plan.reps}`,sug:sg.text,up:!!sg.up,last:lastLine(last),
    sets:Array.from({length:num(plan.sets)||3},(_,i)=>({w:"",reps:"",pw:sg.w!=null?fmtW(sg.w):"",pr:String(lastDone[i]?(sg.up?lo:lastDone[i].reps):lo),done:false}))};
}
function startSession(dayId){

function tick(){
  if(!S) return; const R=TR().rest;
  if(R){
    const left=R.until-Date.now();
    if(left<=0){TR().rest=null; restDoneShow=Date.now()+6000; beep(); commit(false); renderRest()}
    else {const c=document.getElementById("restClk"); if(c) c.textContent=fmtDur(left); const p=document.getElementById("restProg"); if(p) p.style.width=Math.min(100,(1-left/(R.total*1000))*100)+"%"}
  } else if(restDoneShow&&restDoneShow<=Date.now()){restDoneShow=0; renderRest()}
  const a=TR().active, sc=document.getElementById("sessClock"); if(a&&sc) sc.textContent=fmtDur(Date.now()-a.start);
}

function chartSvg(pts,key,unit){
  if(pts.length<2) return `<div class="note">График появится после второй тренировки с этим упражнением.</div>`;
  const W=320,H=150,pl=34,pr=10,pt=12,pb=24; const vs=pts.map(p=>p[key]); let mn=Math.min(...vs), mx=Math.max(...vs); if(mx-mn<1){mx+=1;mn=Math.max(0,mn-1)}
  const pad=(mx-mn)*0.12; mn-=pad; mx+=pad;
  const x=i=>pl+(W-pl-pr)*(pts.length===1?0.5:i/(pts.length-1)), y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  const ticks=[mn+(mx-mn)*0.1,(mn+mx)/2,mx-(mx-mn)*0.1];
  const line=pts.map((p,i)=>`${x(i).toFixed(1)},${y(p[key]).toFixed(1)}`).join(" ");
  const d0=new Date(pts[0].t), d1=new Date(pts[pts.length-1].t), fd=d=>d.toLocaleDateString("ru-RU",{day:"numeric",month:"short"});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="График ${unit}">
    ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-4}" y="${(y(t)+3).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="var(--f-num)">${Math.round(t)}</text>`).join("")}
    <polyline points="${pl},${H-pb} ${line} ${W-pr},${H-pb}" fill="var(--accent-soft)" stroke="none" opacity=".7"/>
    <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p[key]).toFixed(1)}" r="${i===pts.length-1?4.5:3}" fill="${i===pts.length-1?"var(--accent)":"var(--surface)"}" stroke="var(--accent)" stroke-width="2"/>`).join("")}
    <text x="${pl}" y="${H-6}" font-size="10" fill="var(--muted)">${fd(d0)}</text><text x="${W-pr}" y="${H-6}" font-size="10" fill="var(--muted)" text-anchor="end">${fd(d1)}</text>
  </svg>`;
}
function viewHistory(){

    <div class="list">${pts.slice(-5).reverse().map(p=>`<div class="row" style="cursor:default;padding:8px 0"><span class="w"><span class="n" style="font-weight:600">${new Date(p.t).toLocaleDateString("ru-RU",{weekday:"short",day:"numeric",month:"short"})}</span></span><span class="r num">${fmtW(p.best.w)}×${p.best.reps} · объём ${Math.round(p.vol)}</span></div>`).join("")}</div>

}

    if(ex) ex.g+=pend.g; else v.items.push({pid:pend.pid,g:r(pend.g)});
    commit(); afterFix({si:pend.si,pid:pend.pid},onlyDay); return}
  if(a==="fixapply"){const fx=ctx.fx[+b.dataset.fix]; if(fx){const pr=ctx.protect, od=ctx.onlyDay; applyFix(fx); commit(); afterFix(pr,od)} return}
  if(a==="back"){sheetPicker(ctx.mode); return}
  if(a==="apply"){applyG(+b.dataset.g); return}
  if(a==="applyc"){const g=num(cG.value); if(g>0) applyG(g); return}
  if(a==="variants"){ctx={s:+b.dataset.s}; sheetVariants(); return}
  if(a==="choose"){ctx={s:+b.dataset.s,onlyDay:true}; sheetChoose(); return}
  if(a==="chonly"){ctx.onlyDay=b.dataset.v==="1"; sheetChoose(); return}
  if(a==="choosev"){setVariantFor(ctx.s,+b.dataset.v); closeSheet(); commit(); return}
  if(a==="chooser"){const s=S.slots[ctx.s], rec=(RECIPES[s.key]||[]).find(x=>x.id===b.dataset.r); if(!rec) return;
    let vi=s.variants.findIndex(v=>v.recipe===rec.id);
    if(vi<0){s.variants.push({name:rec.name,recipe:rec.id,items:rec.items.map(([cid,g])=>({pid:ensureProd(cid),g}))}); vi=s.variants.length-1}
    setVariantFor(ctx.s,vi); closeSheet(); commit(); return}
  if(a==="vrename"){const s=S.slots[ctx.s], n=vName.value.trim(); if(n){s.variants[vIdx(s,selDay)].name=n; commit(); sheetVariants()} return}
  if(a==="vall"){const s=S.slots[ctx.s], vi=vIdx(s,selDay); S.schedule.forEach(d=>d[s.key]=vi); commit(); sheetVariants(); return}
  if(a==="vcopy"){const s=S.slots[ctx.s], v=clone(s.variants[vIdx(s,selDay)]); v.name=v.name+" (новый)"; s.variants.push(v); S.schedule[selDay][s.key]=s.variants.length-1; commit(); sheetVariants(); return}
  if(a==="vdel"){document.getElementById("vdelc").innerHTML=`<div class="hint warn">Удалить вариант? Дни с ним перейдут на первый вариант.</div><button class="btn danger block" data-act="vdelok">Да, удалить</button>`; return}
  if(a==="vdelok"){const s=S.slots[ctx.s], vi=vIdx(s,selDay); s.variants.splice(vi,1); S.schedule.forEach(d=>{const x=d[s.key]||0; d[s.key]=x===vi?0:x>vi?x-1:x}); commit(); sheetVariants(); return}
  if(a==="newprod"){ctx.back=ctx.mode?{s:ctx.s,i:ctx.i,mode:ctx.mode}:null; sheetProduct(null); return}
  if(a==="editprod"){ctx={}; sheetProduct(b.dataset.id); return}
  if(a==="saveprod"){
    const name=pfName.value.trim(); const k=num(pfK.value);
    if(!name||k<=0){pfCheck.textContent="Нужно название и калории на 100 г."; return}
    const data={name,kcal:k,p:num(pfP.value),f:num(pfF.value),c:num(pfC.value)};
    const pg=num(pfPg.value); if(pg>0){data.pieceG=pg; data.pieceName=pfPn.value.trim()||"шт"}
    let id=ctx.pidEdit;
    if(id){const p=P(id); Object.assign(p,data); if(!(pg>0)){delete p.pieceG; delete p.pieceName}}
    else {id="p"+Date.now().toString(36); S.products.push(Object.assign({id},data))}
    const back=ctx.back; commit();
    if(back&&back.mode==="day"){ctx={onlyDay:true}; startDayAdd(id)}
    else if(back&&back.mode==="dish"){editDish.items.push({pid:id,g:100}); closeSheet(); render()}
    else if(back){ctx={s:back.s,i:back.i,mode:back.mode}; sheetOptions(id)} else closeSheet();
    return}
  if(a==="delprod"){document.getElementById("delConfirm").innerHTML=`<div class="hint warn">Продукт пропадёт из списка и из всех приёмов пищи.</div><button class="btn danger block" data-act="delok">Да, удалить</button>`; return}
  if(a==="delok"){const id=ctx.pidEdit; S.dishes.forEach(ds=>ds.items=ds.items.filter(it=>it.pid!==id)); S.products=S.products.filter(p=>p.id!==id); S.slots.forEach(s=>s.variants.forEach(v=>v.items=v.items.filter(it=>it.pid!==id))); closeSheet(); commit(); return}
  if(a==="seg"){S.profile[b.dataset.k]=b.dataset.v; commit(); return}
  if(a==="bkcopy"){const t=exportText(); const box=document.getElementById("bkOutBox");
    const show=()=>{box.innerHTML=`<div class="field"><label for="bkOut">Выделите и скопируйте</label><textarea id="bkOut" rows="3" readonly></textarea></div>`; const ta=document.getElementById("bkOut"); ta.value=t; ta.focus(); ta.select()};
    try{navigator.clipboard.writeText(t).then(()=>{box.innerHTML=`<div class="hint">Скопировано. Теперь вставьте в другой версии.</div>`},show)}catch(e){show()} return}
  if(a==="bkfile"){const blob=new Blob([exportText()],{type:"application/json"}); const u=URL.createObjectURL(blob); const l=document.createElement("a"); l.href=u; l.download="racion-"+dateKey+".json"; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000); return}
  if(a==="bkimport"){bkAsk(document.getElementById("bkIn").value); return}
  if(a==="bkok"){if(ctx.bkData){useRoot(clone(ctx.bkData)); ctx={}; selDay=todayIdx; editDish=null; commit(); window.scrollTo(0,0)} return}
  if(a==="recmacro"){const m=recMacros(S.profile.goal); S.profile.pPerKg=m.p; S.profile.fPerKg=m.f; commit(); return}
  if(a==="accswitch"){if(ROOT.accounts[b.dataset.id]){ROOT.active=b.dataset.id; S=ROOT.accounts[ROOT.active].state; selDay=todayIdx; editDish=null; commit()} return}
  if(a==="accnew"){document.getElementById("accBox").innerHTML=`<div class="field"><label for="accName">Имя нового аккаунта</label><input id="accName" placeholder="например, Набор весной"></div><div class="grid2"><button class="btn primary block" data-act="accnewok" data-copy="0">Начать с шаблона</button><button class="btn block" data-act="accnewok" data-copy="1">Копия текущего</button></div>`; return}
  if(a==="accnewok"){const n=(document.getElementById("accName").value||"").trim()||"Новый аккаунт"; const id="a"+Date.now().toString(36);
    ROOT.accounts[id]={name:n,state:b.dataset.copy==="1"?fix(clone(S)):fix(clone(DEFAULT))}; ROOT.active=id; S=ROOT.accounts[id].state; selDay=todayIdx; editDish=null; commit(); window.scrollTo(0,0); return}
  if(a==="accrename"){const ids=Object.keys(ROOT.accounts); document.getElementById("accBox").innerHTML=`<div class="field"><label for="accRen">Новое имя</label><input id="accRen" value="${esc(ROOT.accounts[ROOT.active].name)}"></div><button class="btn primary block" data-act="accrenok">Сохранить имя</button>${ids.length>1?`<button class="btn danger block" data-act="accdel">Удалить этот аккаунт</button>`:""}`; return}
  if(a==="accrenok"){const n=document.getElementById("accRen").value.trim(); if(n){ROOT.accounts[ROOT.active].name=n; commit()} return}
  if(a==="accdel"){document.getElementById("accBox").insertAdjacentHTML("beforeend",`<div class="hint warn">Удалить «${esc(ROOT.accounts[ROOT.active].name)}» со всеми продуктами, блюдами и рационом? Это не отменить.</div><button class="btn danger block" data-act="accdelok">Да, удалить</button>`); return}
  if(a==="accdelok"){delete ROOT.accounts[ROOT.active]; ROOT.active=Object.keys(ROOT.accounts)[0]; S=ROOT.accounts[ROOT.active].state; selDay=todayIdx; editDish=null; commit(); return}
  if(a==="pview"){prodView=b.dataset.v; render(); return}
  if(a==="recgoal"){recGoal=b.dataset.v; render(); return}
  if(a==="addcat"){const c=CATALOG.find(x=>x.id===b.dataset.id); if(c&&!haveCat(c)){const p={id:P(c.id)?"p"+Date.now().toString(36):c.id,catId:c.id,name:c.name,kcal:c.kcal,p:c.p,f:c.f,c:c.c}; if(c.pieceG){p.pieceG=c.pieceG;p.pieceName=c.pieceName} S.products.push(p); commit()} return}
});
function liveItem(){const it=curVariant().items[ctx.i]; const m=mac({pid:it.pid,g:num(gIn.value)}); itemMac.innerHTML=macChips(m)}
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="gIn"){liveItem(); return}
  if(t.id==="dName"){editDish.name=t.value; return}
  if(t.classList&&t.classList.contains("dg")){editDish.items[+t.dataset.i].g=num(t.value); dishCalcRefresh(); return}
  if(t.id==="dDay"){dfit.d=+t.value; dishCalcRefresh(); return}
  if(t.id==="daG"){ctx.pend.g=num(t.value); daRes.innerHTML=dayAddRes(); return}
  if(t.id==="pSearch"){pList.innerHTML=pickRows(t.value,ctx.mode==="swap"?curVariant().items[ctx.i].pid:null); return}
  if(t.id==="cG"){const np=P(ctx.pid), g=num(t.value); cRes.innerHTML = g>0 ? (()=>{const res=add(ctx.base,[np.kcal,np.p,np.f,np.c].map(x=>x*g/100)); return `День: <span class="num">${r(res[0])}</span> ккал, белок <span class="num">${r(res[1])}</span> г. ${verdict(res,targets())}`})() : ""; return}
  if(["pfK","pfP","pfF","pfC"].includes(t.id)){checkProd(); return}
  if(t.dataset.pf){S.profile[t.dataset.pf]= t.tagName==="SELECT"?num(t.value):t.value; commit(false); const gr=document.getElementById("goalRes"); if(gr) gr.innerHTML=goalRes(); return}
});
document.addEventListener("change",e=>{const t=e.target; if(t.id==="bkFileIn"&&t.files&&t.files[0]){const fr=new FileReader(); fr.onload=()=>bkAsk(String(fr.result)); fr.readAsText(t.files[0]); t.value=""; return} if(t.dataset&&t.dataset.pf){S.profile[t.dataset.pf]=t.tagName==="SELECT"?num(t.value):t.value; commit(false); const gr=document.getElementById("goalRes"); if(gr) gr.innerHTML=goalRes()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!document.getElementById("sheet").hidden) closeSheet()});

/* ---------- Старт ---------- */
useRoot(loadLocal());
render();
connect();
</script>

<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{})})}
</script>
