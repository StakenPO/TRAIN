<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0e11" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<script>window.__STANDALONE__=true;</script>
<title>Мой рацион</title>
<meta name="apple-mobile-web-app-title" content="Рацион">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: phone app. One column, sticky-free; tab bar fixed at the bottom; editing happens in bottom sheets. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --raise:#f6f8fa; --ink:#15202b; --muted:#5d6b78; --line:#d8dee5;
  --accent:#0f6e6a; --accent-ink:#ffffff; --accent-soft:#d6ecea;
  --protein:#b55a12; --protein-soft:#f6e3d2;
  --ok:#2f7d3c; --ok-soft:#dcefdf; --warn:#a46a00; --warn-soft:#fbefd2; --bad:#b3362c; --bad-soft:#f7dcd9;
  --shade:rgba(10,18,26,.45);
  --f-text:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#18212a; --raise:#1f2a35; --ink:#e7edf2; --muted:#93a1ae; --line:#2a3642;
  --accent:#4fc2bb; --accent-ink:#06201f; --accent-soft:#163a39;
  --protein:#f0a463; --protein-soft:#3a2716;
  --ok:#6cc47a; --ok-soft:#17321c; --warn:#e8b54a; --warn-soft:#382a0c; --bad:#f08a80; --bad-soft:#3d1b18;
  --shade:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#18212a; --raise:#1f2a35; --ink:#e7edf2; --muted:#93a1ae; --line:#2a3642;
  --accent:#4fc2bb; --accent-ink:#06201f; --accent-soft:#163a39;
  --protein:#f0a463; --protein-soft:#3a2716;
  --ok:#6cc47a; --ok-soft:#17321c; --warn:#e8b54a; --warn-soft:#382a0c; --bad:#f08a80; --bad-soft:#3d1b18;
  --shade:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-text);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.wrap{max-width:540px;margin:0 auto;padding-block:18px calc(96px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header */
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{margin:2px 0 0;font-size:27px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
h2{margin:0;font-size:18px;font-weight:800}
.sub{color:var(--muted);font-size:14px}
.sync{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--ok)} .sync.err i{background:var(--bad)}
.toprow{display:flex;flex-direction:column;align-items:flex-start;gap:6px}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.kpi{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.kpi .big{font-size:30px;font-weight:700;letter-spacing:-.02em}
.kpi .of{color:var(--muted);font-size:13px}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--raise);color:var(--muted)}
.mrow{display:grid;grid-template-columns:74px 1fr auto;align-items:center;gap:10px;font-size:13px}
.mrow .lbl{color:var(--muted);font-weight:600}
.mrow .val{white-space:nowrap}
.bar{height:7px;border-radius:99px;background:var(--raise);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar.p>i{background:var(--protein)}
.bar.f>i{background:var(--warn)}
.bar.c>i{background:var(--muted)}

/* Week */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dayb{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
.dayb .wd{font-size:13px;font-weight:800}
.dayb .k{font-size:10px;color:var(--muted);font-family:var(--f-num)}
.dayb.today{border-color:var(--accent)}
.dish{appearance:none;border:0;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;margin-top:4px;cursor:pointer;max-width:100%;text-align:left}
.opt.cur{border-color:var(--accent);background:var(--accent-soft)}
.opt .ing{font-size:13px;color:var(--ink)}
.opt .buy{font-size:12px;color:var(--warn);font-weight:700}
.dayb.mod .wd::after{content:"•";color:var(--warn);margin-left:2px}
.dayb.mod[aria-pressed="true"] .wd::after{color:var(--accent-ink)}
.dayb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dayb[aria-pressed="true"] .k{color:var(--accent-ink);opacity:.8}

/* Meals */
.meal{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.meal.eaten{border-color:var(--ok)}
.mhead{display:flex;align-items:flex-start;gap:10px;padding:14px 16px 8px}
.mhead .t{flex:1;min-width:0}
.mname{font-size:17px;font-weight:800}
.mk{text-align:right;font-size:12px;color:var(--muted);white-space:nowrap}
.mk .num{display:block;font-size:17px;color:var(--ink);font-weight:700}
.vchips{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 8px}
.vchip{appearance:none;border:1px solid var(--line);background:var(--raise);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted)}
.vchip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.items{list-style:none;margin:0;padding:0}
.item{appearance:none;width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;cursor:pointer}
.item:active{background:var(--raise)}
.item .w{min-width:0}
.item .h{display:block;font-size:12px;color:var(--muted)}
.item .g{white-space:nowrap;font-weight:700;display:flex;align-items:center;gap:6px}
.item .g::after{content:"›";color:var(--muted);font-family:var(--f-text);font-size:18px;line-height:1}
.mfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:3px 8px;border-radius:99px;background:var(--raise);color:var(--muted)}
.chip.p{background:var(--protein-soft);color:var(--protein);font-weight:700}
.acts{display:flex;gap:6px;flex-wrap:wrap}

/* Buttons */
.btn{appearance:none;border:1px solid var(--line);background:var(--raise);border-radius:99px;padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft);background:var(--bad-soft)}
.btn.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.btn.small{padding:5px 11px;font-size:13px;min-height:32px}
.btn.block{width:100%}
.btn.ghost{background:transparent}

/* Lists */
.list{display:flex;flex-direction:column}
.row{appearance:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;width:100%;cursor:pointer}
.row:first-child{border-top:0}
.row .w{min-width:0}
.row .n{font-weight:700;display:block;overflow-wrap:anywhere}
.row .h{display:block;font-size:12px;color:var(--muted)}
.row .r{text-align:right;white-space:nowrap;font-size:13px}

/* Forms */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.field input,.field select,.field textarea{appearance:none;width:100%;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--raise);color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{appearance:none;border:0;background:transparent;border-radius:9px;padding:8px 4px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px var(--shade)}
.note{font-size:13px;color:var(--muted)}
.note b{color:var(--ink)}
.hint{font-size:13px;padding:10px 12px;border-radius:12px;background:var(--raise);color:var(--muted)}
.hint.warn{background:var(--warn-soft);color:var(--warn)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--raise);border-radius:12px;padding:10px 12px;min-width:0}
.stat .l{font-size:12px;color:var(--muted);font-weight:600}
.stat .v{font-size:20px;font-weight:700}
.stat.hl{background:var(--accent-soft)} .stat.hl .v{color:var(--accent)}

/* Stepper */
.stepper{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:center}
.stepper input{text-align:center;font-family:var(--f-num);font-size:22px;font-weight:700}

/* Options */
.opt{appearance:none;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.opt:active{border-color:var(--accent)}
.opt .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.opt .ttl{font-weight:800}
.opt .gr{font-size:20px;font-weight:700;color:var(--accent);white-space:nowrap}
.opt .res{font-size:12px;color:var(--muted)}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs .in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.dg{width:78px;font:inherit;font-size:16px;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--raise);color:var(--ink);text-align:right;font-family:var(--f-num)}
.ingr{display:flex;align-items:center;gap:6px;flex:none}
.fitg{font-size:17px;font-weight:700;color:var(--accent);white-space:nowrap}
.tab{appearance:none;border:0;background:transparent;border-radius:12px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}

/* Sheet */
.sheetwrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheetwrap[hidden]{display:none}
.shade{position:absolute;inset:0;background:var(--shade)}
.sheet{position:relative;width:100%;max-width:540px;max-height:88%;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;
  padding-top:10px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
.grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:0 auto}
.shead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{appearance:none;border:0;background:var(--raise);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;flex:none}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.empty{text-align:center;color:var(--muted);padding:12px 0}
.rec{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.rec:first-of-type{border-top:0}
.rec .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.rec .n{font-weight:700;overflow-wrap:anywhere}
.rec .why{font-size:13px;color:var(--muted)}
.rec .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--raise);color:var(--muted)}
.tag.on{background:var(--accent-soft);color:var(--accent)}
.grp{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}

/* Тренировки */
.modesw{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--raise);border:1px solid var(--line);border-radius:14px;padding:3px}
.modesw button{appearance:none;border:0;background:transparent;border-radius:11px;padding:9px 6px;font-weight:800;font-size:14px;color:var(--muted);cursor:pointer}
.modesw button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sethead{display:grid;grid-template-columns:28px 1fr 1fr 48px;gap:8px;padding:6px 16px 0;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.setrow{display:grid;grid-template-columns:28px 1fr 1fr 48px;gap:8px;align-items:center;padding:5px 16px}
.setrow .no{font-family:var(--f-num);color:var(--muted);text-align:center;font-weight:700}
.setrow input{width:100%;min-width:0;font:inherit;font-family:var(--f-num);font-size:16px;padding:8px 6px;border-radius:10px;border:1px solid var(--line);background:var(--raise);color:var(--ink);text-align:center}
.setrow.done input{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.chk{appearance:none;width:48px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--raise);font-size:18px;font-weight:800;cursor:pointer;color:var(--muted)}
.setrow.done .chk{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.sug{font-size:12px;font-weight:700;color:var(--accent);padding:0 16px}
.sug.up{color:var(--ok)}
.last{font-size:12px;color:var(--muted);padding:0 16px}
.exfoot{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px 14px}
.restbar{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;justify-content:center;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.restbar .in{pointer-events:auto;max-width:516px;width:100%;background:var(--ink);color:var(--bg);border-radius:16px;padding:8px 10px 8px 14px;display:flex;align-items:center;gap:6px;box-shadow:0 6px 20px var(--shade)}
.restbar .lbl{font-size:11px;opacity:.75;font-weight:700;display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.restbar .clk{font-family:var(--f-num);font-size:22px;font-weight:700}
.restbar .grow{flex:1;min-width:0}
.restbar button{appearance:none;border:0;background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 10px;font-weight:800;font-size:13px;cursor:pointer}
.restbar.over .in{background:var(--ok);color:var(--surface)}
.restbar .prog{height:4px;border-radius:99px;background:rgba(127,127,127,.35);margin-top:4px;overflow:hidden}
.restbar .prog i{display:block;height:100%;background:var(--accent-soft)}
.bigclock{font-family:var(--f-num);font-size:15px;font-weight:700;color:var(--accent)}
.exed{display:grid;grid-template-columns:1fr 52px 64px 64px;gap:6px;align-items:end;padding:10px 0;border-top:1px solid var(--line)}
.exed:first-child{border-top:0}
.exed .nm{grid-column:1/-1;display:flex;gap:6px;align-items:center}
.exed .nm input{flex:1}
.exed input,.exed select,.wsel{width:100%;min-width:0;font:inherit;font-size:16px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--raise);color:var(--ink)}
.exed label{font-size:11px;color:var(--muted);font-weight:700;display:block;margin-bottom:3px}
.mini{appearance:none;border:1px solid var(--line);background:var(--raise);border-radius:9px;width:36px;height:36px;font-size:15px;cursor:pointer;flex:none;color:var(--ink)}
.wrow{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;padding:4px 0}
.wrow b{font-weight:800}
.chart{width:100%;height:auto;display:block}

/* Не приближать экран при двойном нажатии (щипок для увеличения остаётся) */
html,body,*{touch-action:manipulation}

/* Переключатель разделов: компактный */
.modesw{display:flex;gap:2px;background:var(--raise);border:1px solid var(--line);border-radius:99px;padding:3px;align-self:center;max-width:100%}
.modesw button{appearance:none;border:0;background:transparent;border-radius:99px;padding:6px 13px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.modesw button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px var(--shade)}
/* Фотоотчёт */
.hero{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:16px}
.hero-in{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hero-k{display:flex;flex-direction:column;gap:2px;min-width:0}
.hero-k .lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.hero-k .v{font-size:19px;font-weight:700;white-space:nowrap}
.timeline{position:relative;display:flex;flex-direction:column;gap:18px;padding-left:18px}
.timeline::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:var(--line);border-radius:2px}
.entry{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px}
.entry-dot{position:absolute;left:-19px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--bg)}
.entry-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.entry-m{font-size:24px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.entry-m span{color:var(--muted);font-weight:600}
.entry-note{font-size:14px;color:var(--ink);background:var(--raise);border-radius:12px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.ph-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph{appearance:none;position:relative;display:block;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:var(--raise);border:1px solid var(--line);padding:0;cursor:pointer;width:100%}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ph-l{position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:700;color:#fff;background:rgba(0,0,0,.45);padding:2px 7px;border-radius:99px}

/* ---------- Хранение: несколько аккаунтов; копия на телефоне + облако ---------- */
let ROOT=null, dbRef=null, saving=false, again=false, timer=null, syncState="local";
function fix(s){ // защитить от неполных или старых данных
  const d=clone(DEFAULT); if(!s||typeof s!=="object") return d;
  const p=s.profile||{};
  if(p.steps===undefined){ // старый формат: был только коэффициент активности
    p.steps=5000; p.trainings=3; p.trainMin=60; p.pace=0.5;
  }
  s.profile=Object.assign(d.profile,p);
  if(!Array.isArray(s.products)) s.products=d.products;
  if(!Array.isArray(s.slots)||!s.slots.length) s.slots=d.slots;
  if(!Array.isArray(s.schedule)||s.schedule.length!==7) s.schedule=d.schedule;
  if(!s.eaten) s.eaten={date:"",done:[]};
  if(!Array.isArray(s.dishes)) s.dishes=[];
  if(!s.train||!Array.isArray(s.train.days)) s.train=defaultTrain();
  if(!Array.isArray(s.train.sessions)) s.train.sessions=[];
  if(!Array.isArray(s.train.week)||s.train.week.length!==7) s.train.week=[null,null,null,null,null,null,null];
  if(!s.train.step) s.train.step=2.5;
  if(!s.body||!Array.isArray(s.body.entries)) s.body={entries:[]};
  if(!s.pantry||typeof s.pantry!=="object") s.pantry={};
  if(!s.plans||typeof s.plans!=="object") s.plans={};
  if(!Array.isArray(s.weights)){s.weights=[]; ((s.body||{}).entries||[]).forEach(e=>{if(num(e.weight)&&!s.weights.find(x=>x.date===e.date)) s.weights.push({date:e.date,w:num(e.weight)})})}
  if(!s.planGoal) s.planGoal=s.profile.goal||"cut";
  if(!Array.isArray(s.baseSchedule)||s.baseSchedule.length!==7) s.baseSchedule=clone(d.schedule);
  s.v=1; return s;
}
function wrap(state,name){const id="a"+Date.now().toString(36); return {v:2,active:id,updatedAt:0,accounts:{[id]:{name:name||"Основной",state:fix(state)}}}}
function fixRoot(r){
  if(!r||typeof r!=="object") return wrap(clone(DEFAULT));
  if(r.v!==2) return wrap(r);
  if(!r.accounts||!Object.keys(r.accounts).length) return wrap(clone(DEFAULT));
  Object.values(r.accounts).forEach(a=>{a.state=fix(a.state); if(!a.name) a.name="Аккаунт"});
  if(!r.accounts[r.active]) r.active=Object.keys(r.accounts)[0];
  r.updatedAt=r.updatedAt||0; return r;
}
function useRoot(r){ROOT=fixRoot(r); S=ROOT.accounts[ROOT.active].state}
function saveLocal(){try{localStorage.setItem("ration_v2",JSON.stringify(ROOT))}catch(e){}}
function loadLocal(){
  try{const t=localStorage.getItem("ration_v2"); if(t) return JSON.parse(t);
      const o=localStorage.getItem("ration_v1"); return o?JSON.parse(o):null}catch(e){return null}
}
function setSync(st){syncState=st;const el=document.getElementById("sync");if(el)el.outerHTML=syncHtml()}
function syncHtml(){
  const m={saved:["ok","Сохранено на телефоне и в аккаунте"],saving:["","Сохраняю…"],
    offline:["","Нет сети: сохранено на телефоне, отправлю позже"],error:["err","Не сохранилось в облаке, копия на телефоне"],
    local:["","Сохранено на этом устройстве"]}[syncState]||["",""];
  return `<span class="sync ${m[0]}" id="sync"><i></i>${m[1]}</span>`;
}
function commit(rerender=true){ROOT.updatedAt=Date.now(); saveLocal(); if(rerender) render(); clearTimeout(timer); timer=setTimeout(flush,700)}
async function flush(){
  if(!dbRef) return; if(saving){again=true;return}
  if(navigator.onLine===false){setSync("offline"); return}
  saving=true; setSync("saving");
  try{await dbRef.set(clone(ROOT)); setSync("saved")}catch(e){setSync(navigator.onLine===false?"offline":"error")}
  saving=false; if(again){again=false; flush()}
}
window.addEventListener("online",()=>flush());
window.addEventListener("offline",()=>setSync("offline"));
async function connect(){
  try{
    if(!window.claude||!window.claude.use) return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    dbRef=db.doc("data/users/"+id+"/state");
    const snap=await dbRef.get();
    const remote=snap.exists?snap.data():null;
    const r=remote?fixRoot(clone(remote)):null;
    if(r&&(r.updatedAt||0)>=(ROOT.updatedAt||0)){useRoot(r); saveLocal(); render(); setSync("saved")}
    else {await dbRef.set(clone(ROOT)); setSync("saved")}
  }catch(e){ if(dbRef) setSync(navigator.onLine===false?"offline":"error") }
}

/* ---------- Расчёты ---------- */
const P=id=>S.products.find(p=>p.id===id);
function mac(it){const p=P(it.pid); if(!p) return Z(); const k=it.g/100; return [p.kcal*k,p.p*k,p.f*k,p.c*k]}
function sumItems(items){return items.reduce((a,it)=>add(a,mac(it)),Z())}
function vIdx(slot,d){const i=(S.schedule[d]||{})[slot.key]||0;return Math.min(i,slot.variants.length-1)}
function variantOf(slot,d){return slot.variants[vIdx(slot,d)]}
function dayTotal(d){return S.slots.reduce((a,s)=>add(a,sumItems(variantOf(s,d).items)),Z())}
function targets(){
  const p=S.profile, w=num(p.weight), h=num(p.height), a=num(p.age), bf=num(p.bf);
  const mif=10*w+6.25*h-5*a+(p.sex==="f"?-161:5);
  const lbm=bf>3&&bf<60?w*(1-bf/100):0;
  const katch=lbm?370+21.6*lbm:0;
  const bmr=katch?(mif+katch)/2:mif;               // при известном % жира берём среднее двух формул
  const tef=bmr*0.1;                               // переваривание пищи + минимальные бытовые движения
  const stepsK=num(p.steps)*0.04*(w/70);           // ходьба: ~0,04 ккал на шаг для 70 кг
  const trainK=num(p.trainings)*num(p.trainMin)*((5-1)*3.5*w/200)/7; // силовая ~5 MET, в среднем на день
  const tdee=bmr+tef+stepsK+trainK;
  const pace=num(p.pace)||0.5;
  const auto=p.goal==="cut"?tdee-w*pace/100*7700/7:p.goal==="bulk"?tdee+w*(num(p.bpace)||0.25)/100*7700/7:tdee;
  const kcal=num(p.manualKcal)>0?num(p.manualKcal):auto;
  const prot=w*num(p.pPerKg), fat=w*num(p.fPerKg), carb=Math.max(0,(kcal-prot*4-fat*9)/4);
  return {mif,katch,lbm,bmr,tef,stepsK,trainK,tdee,auto,kcal,p:prot,f:fat,c:carb,fLimit:fat+15};
}
function daysUsing(slotI,vi){const s=S.slots[slotI];return WD.filter((_,d)=>vIdx(s,d)===vi)}
function hintFor(it){
  const p=P(it.pid); if(!p||!p.pieceG) return "";
  const x=it.g/p.pieceG, name=esc(p.pieceName||"шт"), pg=String(p.pieceG).replace(".",",");
  if(x<0.97){
    const fr=[[1/8,"1/8"],[1/4,"1/4"],[1/3,"1/3"],[1/2,"1/2"],[2/3,"2/3"],[3/4,"3/4"]].find(([v])=>Math.abs(x-v)<0.03);
    const t=fr?fr[1]:String(Math.round(x*10)/10||0.1).replace(".",",");
    return `≈ ${t} · 1 ${name} = ${pg} г`;
  }
  const n=p.pieceG<=60?Math.round(x*2)/2:Math.round(x*10)/10;
  return "≈ "+String(n).replace(".",",")+" "+name;
}
function kcalState(v,t){const d=v-t; if(Math.abs(d)<=t*0.03) return ["ok","в цели"]; if(d>0) return [d>t*0.08?"bad":"warn","+"+r(d)+" ккал"]; return [d<-t*0.08?"bad":"warn",r(d)+" ккал"]}

function macroRow(lbl,val,tgt,cls,unit){
  const w=tgt>0?Math.min(100,val/tgt*100):0;
  return `<div class="mrow"><span class="lbl">${lbl}</span><div class="bar ${cls}"><i style="width:${w}%"></i></div><span class="val"><span class="num">${r(val)}</span> / <span class="num">${r(tgt)}</span> ${unit}</span></div>`;
}

  const eatenT = isToday ? S.slots.filter(s=>S.eaten.done.includes(s.key)).reduce((a,s)=>add(a,sumItems(variantOf(s,d).items)),Z()) : null;
  const [st,stTxt]=kcalState(tot[0],T.kcal);
  const pLow=tot[1]<T.p*0.9, fHigh=tot[2]>T.fLimit;

    ${macroRow("Белок",tot[1],T.p,"p","г")}${macroRow("Жиры",tot[2],T.f,"f","г")}${macroRow("Углев.",tot[3],T.c,"c","г")}
    ${pLow?`<div class="hint warn">Белка меньше цели на ${r(T.p-tot[1])} г. Добавьте творог, тунец или курицу.</div>`:""}
    ${fHigh?`<div class="hint warn">Жиров больше нормы на ${r(tot[2]-T.f)} г. Уменьшите масло или жирные продукты.</div>`:""}
    ${dayIssues(d).length?`<button class="btn primary block" data-act="balbtn">⚖ Подогнать день автоматически</button>`:""}

let editDish=null, dfit={si:3,mode:"side",d:null};
function isSide(it){const p=P(it.pid); return !!p&&p.c>5&&p.c*4>=p.p*4&&p.c*4>=p.f*9}
function fitDish(items,si,d,mode){
  const T=dayTarget(d), slot=S.slots[si];
  const cur=sumItems(variantOf(slot,d).items), base=dayTotal(d).map((v,k)=>v-cur[k]);
  const room=T.kcal-base[0], tot=sumItems(items);
  const side=items.filter(isSide), sideK=sumItems(side)[0], restK=tot[0]-sideK;
  let out, bad="";
  if(room<=50) bad="На этот приём в этот день почти не осталось калорий. Выберите другой приём или день.";
  if(mode==="side"&&side.length&&room-restK>sideK*0.2){const k=(room-restK)/sideK; out=items.map(it=>({pid:it.pid,g:isSide(it)?r5(it.g*k):r(it.g)}))}
  else {
    if(mode==="side"&&!bad) bad=side.length?"Не влезает даже с маленьким гарниром, поэтому уменьшено всё пропорционально.":"В блюде нет гарнира (крупа, картошка, хлеб), поэтому порция изменена пропорционально.";
    const k=tot[0]>0?Math.max(0,room)/tot[0]:0; out=items.map(it=>({pid:it.pid,g:r5(it.g*k)}));
  }
  const m=sumItems(out); return {items:out,m,res:add(base,m),room,bad};
}

}

function dishQuality(m){
  const dens=m[0]>0?m[1]/m[0]*100:0;
  if(dens>=8) return ["ok","белковое","Много белка на калорию, хорошо для сушки."];
  if(dens>=5) return ["warn","средне по белку","Нормально, но на сушке лучше больше белковой части или меньше гарнира."];
  return ["bad","мало белка","В основном калории. На сушке ешьте его небольшой порцией или добавьте белок."];
}

/* ---------- Моё блюдо в день: анализ, куда и как влезает ---------- */
function dishSlots(ds,d){
  const tot=sumItems(ds.items)[0], T=dayTarget(d);
  return S.slots.map((s,si)=>{const f=fitDish(ds.items,si,d,"side"); const ratio=tot>0?f.m[0]/tot:0;
    const score=Math.abs(1-Math.min(ratio,1.15))*100+Math.max(0,f.res[2]-T.fLimit)*2+Math.max(0,T.p*0.9-f.res[1])*2;
    return {si,f,ratio,score}}).sort((a,b)=>a.score-b.score);
}
function ratioText(x){if(x>=0.97&&x<=1.05) return ["ok","полная порция"]; if(x>1.05) return ["ok","можно даже больше: +"+r((x-1)*100)+"%"]; return [x>=0.8?"warn":"bad","порция "+r(x*100)+"% от задуманной"]}

function sheetDishInDay(id){
  const ds=S.dishes.find(x=>x.id===id); if(!ds) return; ctx={dish:id};
  const d=selDay, T=dayTarget(selDay), tot=sumItems(ds.items), opts=dishSlots(ds,d); ctx.opts=opts;

  let alt="";
  if(best.ratio<0.9){
    const others=[];
    for(let dd=0;dd<7;dd++){if(dd===d) continue; const o=dishSlots(ds,dd)[0]; if(o.ratio>=best.ratio+0.08) others.push([dd,o])}
    others.sort((a,b)=>b[1].ratio-a[1].ratio);
    alt=`<div class="hint warn">В ${WDF[d]} полная порция (${r(tot[0])} ккал) не влезает ни в один приём. ${others.length?"Больше порция выйдет: "+others.slice(0,3).map(([dd,o])=>`${WD[dd]} (${S.slots[o.si].name.toLowerCase()}, ${r(o.ratio*100)}%)`).join(", ")+".":"В другие дни примерно так же."} Можно взять уменьшенную порцию или полную с заменой чего-то ещё.</div>
    <button class="btn block" data-act="mdfull">Съесть полную порцию и выбрать, что убрать</button>`;
  } else alt=`<div class="hint">Влезает. Лучше всего вместо: <b>${esc(S.slots[best.si].name.toLowerCase())}</b>.</div>`;
  const cards=opts.map((o,i)=>{const s=S.slots[o.si], rt=ratioText(o.ratio);
    return `<button class="opt${i===0?" cur":""}" data-act="mdput" data-i="${i}"><span class="top"><span class="ttl">Вместо: ${esc(s.name.toLowerCase())}</span><span class="gr num" style="font-size:16px">${r(o.f.m[0])} ккал</span></span><span class="res">Сейчас там «${esc(variantOf(s,d).name)}»</span><span class="ing">${esc(o.f.items.map(it=>(P(it.pid)?.name||"?").split(" (")[0]+" "+r(it.g)+" г").join(" · "))}</span><span class="res">День: <span class="num">${r(o.f.res[0])}</span> ккал, белок <span class="num">${r(o.f.res[1])}</span> г, жиры <span class="num">${r(o.f.res[2])}</span> г</span><span><span class="pill ${rt[0]}">${rt[1]}</span> ${verdict(o.f.res,T)}</span></button>`}).join("");
  openSheet(esc(ds.name),`<div class="chips">${macChips(tot)}</div>${alt}<div class="grp">Куда поставить (${WDF[d]})</div>${cards}
    <div class="note tip">Граммы подогнаны меняя гарнир (крупа, картошка, хлеб). Изменение только для этого дня, вернуть можно кнопкой «Вернуть стандартный день».</div>
    <button class="btn ghost block" data-act="mydish">← Другое блюдо</button>`);
}
function placeDish(ds,si,items,d,allWeek){
  const s=S.slots[si], name=allWeek?ds.name:ds.name+" · "+WD[d];
  let vi=s.variants.findIndex(v=>v.dish===ds.id&&v.name===name);
  if(vi<0){s.variants.push({name,dish:ds.id,items:clone(items)}); vi=s.variants.length-1} else s.variants[vi].items=clone(items);
  if(allWeek) S.schedule.forEach(day=>day[s.key]=vi); else S.schedule[d][s.key]=vi;
  return si;
}

    ${recs?`<div class="grp">${S.planGoal==="cut"?"Новые идеи под сушку":"Идеи из меню «"+GOALS[S.planGoal]+"»"}</div>${recs}`:""}

function recMacros(goal){return goal==="cut"?{p:2.0,f:0.7}:goal==="bulk"?{p:1.8,f:0.9}:{p:1.8,f:0.8}}
function goalRes(){
  const T=targets(), p=S.profile, w=num(p.weight);
  const weekly=(T.tdee-T.kcal)*7/7700;
  let eta="";
  if(p.goal==="cut"&&weekly>0.05&&num(p.bf)>num(p.targetBf)&&num(p.targetBf)>0){
    const lean=w*(1-num(p.bf)/100), tw=lean/(1-num(p.targetBf)/100), lose=w-tw, weeks=lose/weekly;
    eta=`<div class="hint">До ${String(p.targetBf).replace(".",",")}% жира: вес около <b class="num">${(Math.round(tw*10)/10+"").replace(".",",")} кг</b>, сбросить ~${(Math.round(lose*10)/10+"").replace(".",",")} кг. Это около <b class="num">${Math.ceil(weeks)}</b> недель.</div>`;
  }
  const rec=recMacros(p.goal);
  const avg=[0,1,2,3,4,5,6].reduce((a,d)=>add(a,dayTotal(d)),Z()).map(x=>x/7);
  const fatLow=num(p.fPerKg)<0.6;
  const row=(l,v,h)=>`<div class="row" style="cursor:default;padding:8px 0"><span class="w"><span class="n" style="font-weight:600">${l}</span>${h?`<span class="h">${h}</span>`:""}</span><span class="r num">${v}</span></div>`;
  return `<h2>Расчёт</h2>
  <div class="list">
    ${row("Обмен в покое",r(T.bmr),T.katch?`среднее Миффлина-Сан Жеора (${r(T.mif)}) и Кэтча-Макардла по сухой массе (${r(T.katch)})`:"формула Миффлина-Сан Жеора; впишите % жира для точности")}
    ${row("Переваривание и быт","+"+r(T.tef),"≈10% от обмена")}
    ${row("Шаги","+"+r(T.stepsK),`${esc(p.steps)} шагов в день`)}
    ${row("Тренировки","+"+r(T.trainK),`${esc(p.trainings)} × ${esc(p.trainMin)} мин в неделю, в среднем на день`)}
    ${row("<b>Поддержание веса</b>",`<b>${r(T.tdee)}</b>`,"")}
  </div>
  <div class="stats">
    <div class="stat hl"><div class="l">Цель, ккал${num(p.manualKcal)>0?" (своя)":""}</div><div class="v num">${r(T.kcal)}</div></div>
    <div class="stat"><div class="l">${weekly>=0?"Минус":"Плюс"} в неделю</div><div class="v num">${(Math.round(Math.abs(weekly)*100)/100+"").replace(".",",")} кг</div></div>
    <div class="stat"><div class="l">Белок</div><div class="v num" style="color:var(--protein)">${r(T.p)} г</div></div>
    <div class="stat"><div class="l">Жиры / Углев.</div><div class="v num">${r(T.f)} / ${r(T.c)}</div></div>
  </div>
  ${num(p.manualKcal)>0?`<div class="note">Стоит своя норма. Автоматический расчёт для выбранного темпа: <b class="num">${r(T.auto)}</b> ккал.</div>`:""}
  ${fatLow?`<div class="hint warn">Жиров меньше 0,6 г на кг. Для гормонов на долгой сушке лучше 0,6-0,8 г/кг (рекомендуемо: ${rec.f}).</div>`:""}
  ${eta}
  <div class="note tip">Расчёт ориентировочный: через 2 недели сверьтесь с весами и поправьте норму.</div>
  <div class="grp">Рацион под эти цифры</div>
  <div class="list">
    ${cmpRow("Калории",avg[0],avg[0],T.kcal,"ккал",Math.abs(avg[0]-T.kcal)<=T.kcal*0.03?"ok":"warn").replace(/→ <b>[^<]*<\/b>/,"")}
    ${cmpRow("Белок",avg[1],avg[1],T.p,"г",avg[1]>=T.p*0.9?"ok":"warn").replace(/→ <b>[^<]*<\/b>/,"")}
    ${cmpRow("Жиры",avg[2],avg[2],T.f,"г",avg[2]<=T.fLimit&&avg[2]>=T.f*0.75?"ok":"warn").replace(/→ <b>[^<]*<\/b>/,"")}
    ${cmpRow("Углеводы",avg[3],avg[3],T.c,"г",Math.abs(avg[3]-T.c)<=35?"ok":"warn").replace(/→ <b>[^<]*<\/b>/,"")}
  </div>
  <div class="note tip">Слева рацион сейчас (в среднем за день), справа цель.</div>
  <div class="hint">${planInfo()}</div>
  <button class="btn primary block" data-act="planfit">Пересчитать рацион под эти цифры</button>
  ${S.planUndo?`<button class="btn ghost block" data-act="planundo">↺ Вернуть рацион как был до пересчёта</button>`:""}

}

function pickRows(q,excl){

function ownVariant(si,d){

function pendMac(){if(!ctx.pend) return Z(); const p=P(ctx.pend.pid); return [p.kcal,p.p,p.f,p.c].map(x=>x*ctx.pend.g/100)}
function fixes(d){
  const T=dayTarget(d), base=add(dayTotal(d),pendMac()), excess=base[0]-T.kcal;
  if(excess<=T.kcal*0.03) return [];
  const out=[];
  S.slots.forEach((s,si)=>variantOf(s,d).items.forEach((it,ii)=>{
    const p=P(it.pid); if(!p||p.kcal<=0) return;
    if(ctx.protect&&si===ctx.protect.si&&(ctx.protect.pid==null||it.pid===ctx.protect.pid)) return;
    const m=mac(it), where=s.name.toLowerCase();
    if(m[0]>=20) out.push({si,ii,g:0,res:base.map((v,k)=>v-m[k]),text:`Убрать ${p.name}, ${r(it.g)} г (${where})`});
    const need=excess/p.kcal*100, ng=r5(it.g-need);
    if(need>=5&&ng>=5&&ng<it.g){const dm=[p.kcal,p.p,p.f,p.c].map(x=>x*(it.g-ng)/100); out.push({si,ii,g:ng,res:base.map((v,k)=>v-dm[k]),text:`${p.name} (${where}): ${r(it.g)} → ${ng} г`})}
  }));
  S.slots.forEach((s,si)=>{const v=variantOf(s,d); if(v.items.length<2) return; if(ctx.protect&&si===ctx.protect.si) return;
    const m=sumItems(v.items); out.push({si,ii:-1,g:0,res:base.map((x,k)=>x-m[k]),text:`Убрать весь ${s.name.toLowerCase()} (${v.items.map(it=>P(it.pid)?.name.split(" ")[0]).join(", ")})`})});
  out.forEach(o=>{const x=o.res, it=o.ii>=0?variantOf(S.slots[o.si],d).items[o.ii]:null;
    o.score=Math.abs(x[0]-T.kcal)+Math.max(0,T.p*0.9-x[1])*8+Math.max(0,x[2]-T.fLimit)*9+(o.g===0?20:0)+(it&&o.g>0&&o.g<it.g*0.4?60:0)});
  return out.sort((a,b)=>a.score-b.score).slice(0,5);
}
function fixCards(fx,act,T){return fx.map((o,i)=>`<button class="opt" data-act="${act}" data-fix="${i}"><span class="ttl">${esc(o.text)}</span><span class="res">День: <span class="num">${r(o.res[0])}</span> ккал, белок <span class="num">${r(o.res[1])}</span> г, жиры <span class="num">${r(o.res[2])}</span> г</span><span>${verdict(o.res,T)}</span></button>`).join("")}

/* ---------- Автоподгонка дня: меняем граммы в других приёмах ---------- */
function dayIssues(d){
  const T=dayTarget(d), t=dayTotal(d), out=[];
  if(Math.abs(t[0]-T.kcal)>T.kcal*0.03) out.push("kcal");
  if(t[2]>T.fLimit) out.push("fat");
  if(t[1]<T.p*0.9) out.push("prot");
  if(t[3]>T.c+30) out.push("carb");
  return out;
}
function balanceDay(d,lock){
  const T=dayTarget(d), items=[];
  S.slots.forEach((s,si)=>variantOf(s,d).items.forEach((it,ii)=>{const p=P(it.pid); if(!p) return;
    const locked=lock.slots.has(si)||(lock.item&&lock.item.si===si&&lock.item.pid===it.pid);
    items.push({si,ii,pid:it.pid,g0:it.g,g:it.g,u:[p.kcal,p.p,p.f,p.c].map(x=>x/100),locked})}));
  const tot=()=>items.reduce((a,x)=>a.map((v,k)=>v+x.u[k]*x.g),[0,0,0,0]);
  const cost=()=>{const t=tot();
    const ek=(t[0]-T.kcal)/(T.kcal*0.025), ef=Math.max(0,t[2]-T.f)/4, efl=Math.max(0,T.f*0.6-t[2])/5,
          ep=Math.max(0,T.p*0.95-t[1])/4, ec=Math.max(0,t[3]-T.c)/15;
    let ch=0; for(const x of items){if(x.locked) continue; const rel=(x.g-x.g0)/Math.max(x.g0,20); ch+=rel*rel*0.6+(x.g===0&&x.g0>0?0.4:0)}
    return ek*ek+ef*ef+efl*efl+ep*ep+ec*ec*0.5+ch};
  let cur=cost();
  for(let n=0;n<400;n++){
    let best=null;
    for(const x of items){ if(x.locked) continue;
      const st=Math.max(5,r5(x.g0*0.1));
      for(const ng of [x.g-st,x.g+st,0]){ if(ng<0||ng>x.g0*1.6+10||ng===x.g) continue;
        const old=x.g; x.g=ng; const c=cost(); x.g=old; if(c<cur-1e-6&&(!best||c<best.c)) best={set:[[x,ng]],c} } }
    S.slots.forEach((s,si)=>{const xs=items.filter(x=>x.si===si&&!x.locked&&x.g>0); if(xs.length<2||items.some(x=>x.si===si&&x.locked)) return;
      const olds=xs.map(x=>x.g); xs.forEach(x=>x.g=0); const c=cost(); xs.forEach((x,i)=>x.g=olds[i]);
      if(c<cur-1e-6&&(!best||c<best.c)) best={set:xs.map(x=>[x,0]),c}});
    if(!best) break; best.set.forEach(([x,g])=>x.g=g); cur=best.c;
  }
  return {items,tot:tot()};
}
function balChanges(items){
  const out=[];
  S.slots.forEach((s,si)=>{const xs=items.filter(x=>x.si===si); const changed=xs.filter(x=>Math.abs(x.g-x.g0)>0.01); if(!changed.length) return;
    if(xs.every(x=>x.g===0)){const k=xs.reduce((a,x)=>a+x.u[0]*x.g0,0); out.push(`Пропустить ${s.name.toLowerCase()} (${r(k)} ккал)`); return}
    changed.forEach(x=>{const n=(P(x.pid)?.name||"?").split(" (")[0]; out.push(x.g===0?`Убрать ${n} из «${s.name.toLowerCase()}»`:`${n} (${s.name.toLowerCase()}): ${r(x.g0)} → ${r(x.g)} г`)})});
  return out;
}

function applyBalance(){

/* ---------- Вернуть день к стандарту ---------- */
const DAYTAG=/ · (Пн|Вт|Ср|Чт|Пт|Сб|Вс)$/;
function stdIdx(s,d){const i=((S.baseSchedule||DEFAULT.schedule)[d]||{})[s.key]||0; const v=s.variants.findIndex((x,j)=>j>=i&&!DAYTAG.test(x.name)); return v<0?0:Math.min(i,s.variants.length-1)}
function isStd(d){return S.slots.every(s=>vIdx(s,d)===stdIdx(s,d))}
function sheetRestore(){

/* ---------- Вкладка «Прогресс» ---------- */
let histEx=null;
function exStats(){
  const map={};
  TR().sessions.forEach(s=>s.ex.forEach(e=>{const d=e.sets.filter(x=>x.done); if(!d.length) return; const k=exKey(e.name);
    const best=d.reduce((b,x)=>e1rm(x.w,x.reps)>e1rm(b.w,b.reps)?x:b,d[0]);
    (map[k]=map[k]||{name:e.name,pts:[]}).pts.push({t:s.start,w:Math.max(...d.map(x=>num(x.w))),e1:e1rm(best.w,best.reps),best,vol:d.reduce((a,x)=>a+num(x.w)*num(x.reps),0),reps:d.reduce((a,x)=>a+num(x.reps),0)})}));
  return map;
}
function chartSvg(pts,key,unit){
  if(pts.length<2) return `<div class="note">График появится после второй тренировки с этим упражнением.</div>`;
  const W=320,H=150,pl=34,pr=10,pt=12,pb=24; const vs=pts.map(p=>p[key]); let mn=Math.min(...vs), mx=Math.max(...vs); if(mx-mn<1){mx+=1;mn=Math.max(0,mn-1)}
  const pad=(mx-mn)*0.12; mn-=pad; mx+=pad;
  const x=i=>pl+(W-pl-pr)*(pts.length===1?0.5:i/(pts.length-1)), y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  const ticks=[mn+(mx-mn)*0.1,(mn+mx)/2,mx-(mx-mn)*0.1];
  const line=pts.map((p,i)=>`${x(i).toFixed(1)},${y(p[key]).toFixed(1)}`).join(" ");
  const d0=new Date(pts[0].t), d1=new Date(pts[pts.length-1].t), fd=d=>d.toLocaleDateString("ru-RU",{day:"numeric",month:"short"});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="График ${unit}">
    ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-4}" y="${(y(t)+3).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="var(--f-num)">${Math.round(t)}</text>`).join("")}
    <polyline points="${pl},${H-pb} ${line} ${W-pr},${H-pb}" fill="var(--accent-soft)" stroke="none" opacity=".7"/>
    <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p[key]).toFixed(1)}" r="${i===pts.length-1?4.5:3}" fill="${i===pts.length-1?"var(--accent)":"var(--surface)"}" stroke="var(--accent)" stroke-width="2"/>`).join("")}
    <text x="${pl}" y="${H-6}" font-size="10" fill="var(--muted)">${fd(d0)}</text><text x="${W-pr}" y="${H-6}" font-size="10" fill="var(--muted)" text-anchor="end">${fd(d1)}</text>
  </svg>`;
}
function viewHistory(){
  const T=TR(), ss=T.sessions, st=exStats(), keys=Object.keys(st).sort((a,b)=>st[a].name.localeCompare(st[b].name,"ru"));
  const m4=Date.now()-28*864e5, last4=ss.filter(s=>s.start>=m4).length;
  const avgDur=ss.length?ss.reduce((a,s)=>a+((s.end||s.start)-s.start),0)/ss.length:0;
  let h=`<header class="toprow"><div><div class="eyebrow">Прогресс</div><h1>История</h1><div class="sub">Рекорды и динамика по упражнениям</div></div>${syncHtml()}</header>
  <div class="stats"><div class="stat hl"><div class="l">Всего тренировок</div><div class="v num">${ss.length}</div></div><div class="stat"><div class="l">За 4 недели</div><div class="v num">${last4}</div></div>
  <div class="stat"><div class="l">Средняя длительность</div><div class="v num">${ss.length?fmtDur(avgDur):"–"}</div></div><div class="stat"><div class="l">Подходов всего</div><div class="v num">${ss.reduce((a,s)=>a+sessSets(s),0)}</div></div></div>`;
  if(!ss.length) return h+`<section class="card"><div class="empty">Пока пусто. Завершите первую тренировку, и здесь появятся графики и рекорды.</div></section>`;
  if(!histEx||!st[histEx]) histEx=keys[0];
  const cur=st[histEx], pts=cur.pts, bestW=Math.max(...pts.map(p=>p.w)), bestE=pts.reduce((b,p)=>p.e1>b.e1?p:b,pts[0]);
  const first=pts[0], lastP=pts[pts.length-1], grow=first.e1>0?(lastP.e1-first.e1)/first.e1*100:0;
  h+=`<section class="card"><h2>Упражнение</h2>
    <div class="field"><select class="wsel" data-tw="histex" aria-label="Упражнение">${keys.map(k=>`<option value="${esc(k)}" ${k===histEx?"selected":""}>${esc(st[k].name)} (${st[k].pts.length})</option>`).join("")}</select></div>
    <div class="stats"><div class="stat hl"><div class="l">Макс. вес</div><div class="v num">${fmtW(bestW)} кг</div></div><div class="stat"><div class="l">Расчётный максимум на 1 раз</div><div class="v num">${fmtW(Math.round(bestE.e1*10)/10)} кг</div></div></div>
    <span class="flabel">Расчётный максимум (по лучшему подходу)</span>${chartSvg(pts,"e1","кг")}
    ${pts.length>1?`<div class="note">С ${new Date(first.t).toLocaleDateString("ru-RU",{day:"numeric",month:"short"})}: <b class="num">${grow>=0?"+":""}${Math.round(grow)}%</b>. Лучший подход: ${fmtW(bestE.best.w)} кг × ${bestE.best.reps}.</div>`:""}
    <div class="list">${pts.slice(-5).reverse().map(p=>`<div class="row" style="cursor:default;padding:8px 0"><span class="w"><span class="n" style="font-weight:600">${new Date(p.t).toLocaleDateString("ru-RU",{weekday:"short",day:"numeric",month:"short"})}</span></span><span class="r num">${fmtW(p.best.w)}×${p.best.reps} · объём ${Math.round(p.vol)}</span></div>`).join("")}</div>
  </section>`;
  h+=`<div class="grp">Все тренировки</div><section class="card" style="gap:0;padding-block:4px"><div class="list">${ss.slice().reverse().map(s=>`<button class="row" data-act="t_sess" data-id="${s.id}"><span class="w"><span class="n">${esc(s.name)} <span class="h" style="display:inline">${esc(s.focus||"")}</span></span><span class="h">${new Date(s.start).toLocaleDateString("ru-RU",{weekday:"short",day:"numeric",month:"long"})} · ${fmtDur((s.end||s.start)-s.start)}</span></span><span class="r num">${sessSets(s)} подх.<br>${Math.round(sessVolume(s))} кг</span></button>`).join("")}</div></section>
  <p class="note tip">Расчётный максимум считается по формуле Эпли: вес × (1 + повторы / 30). Он позволяет сравнивать подходы с разным числом повторов.</p>`;
  return h;
}
function sheetSession(id){
  const s=TR().sessions.find(x=>x.id===id); if(!s) return; ctx={sess:id};
  openSheet(esc(s.name),`<div class="note">${new Date(s.start).toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long"})} · ${fmtDur((s.end||s.start)-s.start)} · ${sessSets(s)} подходов · объём ${Math.round(sessVolume(s))} кг</div>

function finishSummary(s,prs){
  openSheet("Тренировка завершена",`<div class="stats"><div class="stat hl"><div class="l">Время</div><div class="v num">${fmtDur(s.end-s.start)}</div></div><div class="stat"><div class="l">Подходов</div><div class="v num">${sessSets(s)}</div></div>
    <div class="stat"><div class="l">Объём</div><div class="v num">${Math.round(sessVolume(s))} кг</div></div><div class="stat"><div class="l">Упражнений</div><div class="v num">${s.ex.length}</div></div></div>
    ${prs.length?`<div class="grp">Новые рекорды</div><div class="list">${prs.map(p=>`<div class="row" style="cursor:default"><span class="w"><span class="n">${esc(p.name)}</span><span class="h">${fmtW(p.w)} кг × ${p.reps}</span></span><span class="pill ok">рекорд</span></div>`).join("")}</div>`:`<div class="note">Результаты сохранены. В следующий раз приложение подскажет, где добавить вес.</div>`}
    <div id="fsWBox"><div class="coderow"><div class="field"><label for="fsW">Взвесились? Вес, кг</label><input id="fsW" type="number" inputmode="decimal" step="0.1" placeholder="${fmtW(S.profile.weight)}"></div><button class="btn" data-act="w_quick">Записать</button></div></div>

}

const MONTHS=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];

const BD=()=>S.body;
const isoToday=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const pDate=s=>{const [y,m,d]=String(s).split("-").map(Number);return new Date(y,(m||1)-1,d||1)};

/* Хранилище фото на устройстве (IndexedDB) */
const PDB={db:null,
  open(){if(this.db) return Promise.resolve(this.db); return new Promise((res,rej)=>{try{const r=indexedDB.open("racion-photos",1); r.onupgradeneeded=()=>r.result.createObjectStore("p"); r.onsuccess=()=>{this.db=r.result;res(this.db)}; r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
  async tx(mode,fn){const db=await this.open(); return new Promise((res,rej)=>{const t=db.transaction("p",mode); const st=t.objectStore("p"); const out=fn(st); t.oncomplete=()=>res(out&&out.result!==undefined?out.result:undefined); t.onerror=()=>rej(t.error)})},
  put(id,blob){return this.tx("readwrite",st=>st.put(blob,id))},
  async get(id){const db=await this.open(); return new Promise((res)=>{const r=db.transaction("p").objectStore("p").get(id); r.onsuccess=()=>res(r.result||null); r.onerror=()=>res(null)})},
  del(id){return this.tx("readwrite",st=>st.delete(id)).catch(()=>{})}
};
const purl={};
async function photoURL(id){if(purl[id]) return purl[id]; try{const b=await PDB.get(id); if(b){purl[id]=URL.createObjectURL(b); return purl[id]}}catch(e){} return null}
function hydratePhotos(root){
  (root||document).querySelectorAll("img[data-pid]").forEach(async img=>{
    const id=img.dataset.pid, u=await photoURL(id);
    if(u){img.src=u; img.closest(".ph")?.classList.remove("missing")} else img.closest(".ph")?.classList.add("missing");
  });
}
async function shrinkImage(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url});
    const max=1400, k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas"); c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return await new Promise(res=>c.toBlob(b=>res(b),"image/jpeg",0.82));
  } finally {URL.revokeObjectURL(url)}
}

function fmtDate(s,withYear=true){const d=pDate(s);return d.getDate()+" "+MONTHS[d.getMonth()]+(withYear?" "+d.getFullYear():"")}
function daysBetween(a,b){return Math.round((pDate(b)-pDate(a))/864e5)}
function signed(v,unit,dec=1){const x=Math.round(v*Math.pow(10,dec))/Math.pow(10,dec); return (x>0?"+":x<0?"−":"±")+String(Math.abs(x)).replace(".",",")+(unit?" "+unit:"")}
function viewPhotos(){

    const dw=first&&last&&num(first.weight)&&num(last.weight)?num(last.weight)-num(first.weight):null;
    const dwa=first&&last&&num(first.waist)&&num(last.waist)?num(last.waist)-num(first.waist):null;
    h+=`<section class="hero"><div class="hero-in">
      <div class="hero-k"><span class="lbl">С начала</span><span class="v num">${es.length>1?daysBetween(first.date,last.date)+" дн.":"старт"}</span></div>
      <div class="hero-k"><span class="lbl">Вес</span><span class="v num">${dw!=null&&es.length>1?signed(dw,"кг"):num(last.weight)?fmtW(last.weight)+" кг":"–"}</span></div>
      <div class="hero-k"><span class="lbl">Талия</span><span class="v num">${dwa!=null&&es.length>1?signed(dwa,"см"):num(last.waist)?fmtW(last.waist)+" см":"–"}</span></div>
    </div></section>`;
    const since=daysBetween(last.date,isoToday()), next=30-since;
    h+= next<=0?`<div class="hint warn">Последний отчёт ${since} дн. назад. Пора сделать новый: те же позы, тот же свет, утром до еды.</div>`

  }

  if(!es.length) return h+`<section class="card empty-hero"><div class="ph-demo">${POSES.map(([,l])=>`<div class="ph-ghost"><span>${l}</span></div>`).join("")}</div>
    <h2>Первый отчёт: точка старта</h2><div class="note">Сделайте 3 фото: спереди, сбоку и сзади. Встаньте у одной и той же стены, при одном свете, в одной одежде. Добавьте вес и талию на уровне пупка. Через месяц повторите, и здесь появится лента изменений и сравнение «до / после».</div></section>`;
  const pts=es.filter(e=>num(e.weight)).map(e=>({t:pDate(e.date).getTime(),w:num(e.weight)}));
  if(pts.length>=2) h+=`<section class="card"><h2>Вес по отчётам</h2>${chartSvg(pts,"w","кг")}</section>`;
  const desc=es.slice().reverse();
  h+=`<div class="timeline">`+desc.map(e=>{
    const i=es.indexOf(e), prev=es[i-1], d=pDate(e.date), mNo=Math.round(daysBetween(first.date,e.date)/30);
    const chips=[]; if(num(e.weight)) chips.push(`<span class="chip num">${fmtW(e.weight)} кг</span>`);
    if(prev&&num(prev.weight)&&num(e.weight)){const v=num(e.weight)-num(prev.weight); chips.push(`<span class="pill ${v<=0?"ok":"warn"}">${signed(v,"кг")}</span>`)}
    if(num(e.waist)) chips.push(`<span class="chip num">талия ${fmtW(e.waist)} см</span>`);
    if(prev&&num(prev.waist)&&num(e.waist)){const v=num(e.waist)-num(prev.waist); chips.push(`<span class="pill ${v<=0?"ok":"warn"}">${signed(v,"см")}</span>`)}
    if(num(e.bf)) chips.push(`<span class="chip num">жир ${fmtW(e.bf)}%</span>`);
    const ph=POSES.map(([k,l])=>{const p=(e.photos||{})[k]; return p?`<button class="ph" data-act="b_view" data-e="${e.id}" data-k="${k}" aria-label="${l}, ${fmtDate(e.date)}"><img data-pid="${p}" alt=""><span class="ph-l">${l}</span></button>`:`<div class="ph none"><span class="ph-l">${l}</span><span class="ph-n">нет фото</span></div>`}).join("");

function isoNext(s){const d=pDate(s); d.setDate(d.getDate()+30); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

/* ---------- Сравнение ---------- */
let cmp={a:null,b:null,k:"front"};
function viewCompare(){
  const es=entriesAsc();
  let h=`<header class="toprow"><div><div class="eyebrow">Фотоотчёт</div><h1>До и после</h1><div class="sub">Сдвигайте шторку, чтобы увидеть разницу</div></div>${syncHtml()}</header>`;
  if(es.length<2) return h+`<section class="card"><div class="empty">Для сравнения нужно минимум 2 отчёта. ${es.length?"Первый уже есть, следующий через месяц.":"Начните с первого на вкладке «Фотоотчёт»."}</div></section>`;
  if(!cmp.a||!es.find(e=>e.id===cmp.a)) cmp.a=es[0].id;
  if(!cmp.b||!es.find(e=>e.id===cmp.b)) cmp.b=es[es.length-1].id;
  const A=es.find(e=>e.id===cmp.a), B=es.find(e=>e.id===cmp.b);
  const opt=sel=>es.map(e=>`<option value="${e.id}" ${e.id===sel?"selected":""}>${fmtDate(e.date)}</option>`).join("");
  const pa=(A.photos||{})[cmp.k], pb=(B.photos||{})[cmp.k];
  h+=`<section class="card">
    <div class="grid2"><div class="field"><label for="cmpA">До</label><select id="cmpA" data-bw="a">${opt(cmp.a)}</select></div><div class="field"><label for="cmpB">После</label><select id="cmpB" data-bw="b">${opt(cmp.b)}</select></div></div>
    <div class="seg">${POSES.map(([k,l])=>`<button data-act="b_pose" data-k="${k}" aria-pressed="${k===cmp.k}">${l}</button>`).join("")}</div>
  </section>`;
  if(pa&&pb){
    h+=`<div class="cmp" id="cmpBox"><img class="cmp-a" data-pid="${pa}" alt="До"><img class="cmp-b" id="cmpAfter" data-pid="${pb}" alt="После" style="clip-path:inset(0 0 0 50%)">
      <div class="cmp-line" id="cmpLine" style="left:50%"><span>⇆</span></div>
      <span class="cmp-tag l">${fmtDate(A.date,false)}</span><span class="cmp-tag r">${fmtDate(B.date,false)}</span>
      <input type="range" id="cmpR" min="0" max="100" value="50" aria-label="Шторка сравнения"></div>`;
  } else h+=`<div class="hint">В одном из отчётов нет фото «${POSES.find(p=>p[0]===cmp.k)[1].toLowerCase()}». Выберите другую позу или другой отчёт.</div>`;
  h+=`<div class="pair">${[A,B].map((e,i)=>{const p=(e.photos||{})[cmp.k]; return `<div class="pair-i"><div class="ph">${p?`<img data-pid="${p}" alt="">`:`<span class="ph-n">нет фото</span>`}<span class="ph-l">${i?"После":"До"}</span></div><div class="sub">${fmtDate(e.date)}</div></div>`}).join("")}</div>`;
  const rows=[];
  const dd=daysBetween(A.date,B.date); rows.push(["Прошло",dd+" дн."]);
  if(num(A.weight)&&num(B.weight)) rows.push(["Вес",`${fmtW(A.weight)} → ${fmtW(B.weight)} кг <span class="pill ${num(B.weight)<=num(A.weight)?"ok":"warn"}">${signed(num(B.weight)-num(A.weight),"кг")}</span>`]);
  if(num(A.waist)&&num(B.waist)) rows.push(["Талия",`${fmtW(A.waist)} → ${fmtW(B.waist)} см <span class="pill ${num(B.waist)<=num(A.waist)?"ok":"warn"}">${signed(num(B.waist)-num(A.waist),"см")}</span>`]);
  if(num(A.bf)&&num(B.bf)) rows.push(["Жир",`${fmtW(A.bf)} → ${fmtW(B.bf)}% <span class="pill ${num(B.bf)<=num(A.bf)?"ok":"warn"}">${signed(num(B.bf)-num(A.bf),"%")}</span>`]);
  if(num(A.weight)&&num(B.weight)&&dd>=7) rows.push(["Темп",`${signed((num(B.weight)-num(A.weight))/dd*7,"кг/нед",2)}`]);
  h+=`<section class="card"><h2>Изменения</h2><div class="list">${rows.map(([l,v])=>`<div class="row" style="cursor:default;padding:9px 0"><span class="w"><span class="n" style="font-weight:600">${l}</span></span><span class="r num">${v}</span></div>`).join("")}</div></section>`;
  return h;
}

let viewerList=[], viewerI=0;
function openViewer(entryId,pose){
  viewerList=[]; entriesAsc().forEach(e=>POSES.forEach(([k,l])=>{const p=(e.photos||{})[k]; if(p) viewerList.push({p,e,k,l})}));
  viewerI=Math.max(0,viewerList.findIndex(x=>x.e.id===entryId&&x.k===pose)); showViewer();
}
function showViewer(){
  const v=document.getElementById("viewer"), it=viewerList[viewerI]; if(!it){v.hidden=true; return}
  v.hidden=false; document.body.style.overflow="hidden";
  v.innerHTML=`<div class="vw-top"><div><b>${fmtDate(it.e.date)}</b><span>${it.l}${num(it.e.weight)?" · "+fmtW(it.e.weight)+" кг":""}</span></div><button class="x" data-act="b_vclose" aria-label="Закрыть">✕</button></div>
    <img data-pid="${it.p}" alt="${it.l}, ${fmtDate(it.e.date)}">
    <div class="vw-nav"><button data-act="b_vprev" ${viewerI?"":"disabled"} aria-label="Предыдущее">‹</button><span class="num">${viewerI+1} / ${viewerList.length}</span><button data-act="b_vnext" ${viewerI<viewerList.length-1?"":"disabled"} aria-label="Следующее">›</button></div>`;
  hydratePhotos(v);
}
function closeViewer(){const v=document.getElementById("viewer"); v.hidden=true; v.innerHTML=""; document.body.style.overflow=""}
let tx0=null;
document.addEventListener("touchstart",e=>{if(e.target.closest("#viewer")) tx0=e.touches[0].clientX},{passive:true});
document.addEventListener("touchend",e=>{if(tx0==null||!e.target.closest("#viewer")) return; const dx=e.changedTouches[0].clientX-tx0; tx0=null;
  if(Math.abs(dx)>50){viewerI=Math.min(viewerList.length-1,Math.max(0,viewerI+(dx<0?1:-1))); showViewer()}},{passive:true});
document.addEventListener("keydown",e=>{const v=document.getElementById("viewer"); if(!v||v.hidden) return;
  if(e.key==="Escape") closeViewer(); if(e.key==="ArrowRight"&&viewerI<viewerList.length-1){viewerI++;showViewer()} if(e.key==="ArrowLeft"&&viewerI>0){viewerI--;showViewer()}});


/* ---------- Покупки: есть дома / докупить ---------- */
function shSet(id,haveG){if(!S.pantry) S.pantry={}; const pe=S.pantry[id]=S.pantry[id]||{}; pe.have=haveG; pe.bought=false}
function shRefresh(id){const need=shopNeed()[id]||0, x=shopState(id,need), el=document.getElementById("sh_"+id); if(el){el.className="pill "+x.cls; el.textContent=x.txt}}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return; const a=b.dataset.act; if(!a.startsWith("sh_")) return;
  if(a==="sh_f"){shFilter=b.dataset.v; render(); return}
  if(a==="sh_step"){const id=b.dataset.id, p=P(id), pe=(S.pantry||{})[id]||{}, step=p.pieceG?p.pieceG:100; shSet(id,Math.max(0,num(pe.have)+step*(+b.dataset.d))); commit(); return}
  if(a==="sh_buy"){if(!S.pantry) S.pantry={}; const pe=S.pantry[b.dataset.id]=S.pantry[b.dataset.id]||{}; pe.bought=!pe.bought; commit(); return}
  if(a==="sh_reset"){document.getElementById("shMsg").innerHTML=`<div class="hint warn">Очистить «есть дома» и отметки «куплено»?</div><button class="btn danger block" data-act="sh_resetok">Да, новая неделя</button>`; return}
  if(a==="sh_resetok"){S.pantry={}; shFilter="all"; commit(); return}
  if(a==="sh_copy"){const need=shopNeed(); const lines=Object.entries(need).filter(([id,g])=>P(id)&&g>0).map(([id,g])=>[id,shopState(id,g)]).filter(([,x])=>x.left>0).map(([id,x])=>"• "+P(id).name.split(" (")[0]+" — "+x.short);
    const t=lines.length?"Купить:\n"+lines.join("\n"):"Всё есть"; const m=document.getElementById("shMsg");
    const show=()=>{m.innerHTML=`<div class="field"><label for="shOut">Выделите и скопируйте</label><textarea id="shOut" rows="5" readonly></textarea></div>`; const ta=document.getElementById("shOut"); ta.value=t; ta.focus(); ta.select()};
    try{navigator.clipboard.writeText(t).then(()=>{m.innerHTML=`<div class="hint">Список скопирован, можно вставить в Заметки или мессенджер.</div>`},show)}catch(x){show()} return}
});
document.addEventListener("input",e=>{const t=e.target; if(!t.dataset||!t.dataset.sh||!S) return; const id=t.dataset.sh, p=P(id); const v=num(t.value);
  if(t.value===""){if(S.pantry&&S.pantry[id]) {S.pantry[id].have=""; S.pantry[id].bought=false}} else shSet(id,v);
  const hh=document.getElementById("shh_"+id); if(hh&&p.pieceG) hh.textContent=v>0?"дома ≈ "+pcsTxt(p,v):"1 "+(p.pieceName||"шт")+" = "+fmtW(p.pieceG)+" г";
  commit(false); shRefresh(id)});

const NUTRI_KEYS=["manualKcal","pPerKg","fPerKg","pace","bpace"];
function switchGoal(g){

  S.plans[old]={slots:S.slots,schedule:S.schedule,base:S.baseSchedule,prof:Object.fromEntries(NUTRI_KEYS.map(k=>[k,S.profile[k]]))};
  S.profile.goal=g; S.planUndo=null;

  if(saved&&saved.slots){

    S.planGoal=g;
  } else {

function buildPlan(g){
  S.planGoal=g; S.planUndo=null;
  if(g==="cut"){const d=clone(DEFAULT); S.slots=d.slots; S.schedule=d.schedule; S.baseSchedule=clone(d.schedule); return}
  const defs=[["breakfast","Завтрак"],["lunch","Обед"],["snack","Перекус"],["dinner","Ужин"]].concat(g==="bulk"?[["late","Перед сном"]]:[]);
  S.slots=defs.map(([key,name])=>({key,name,variants:BULK_MENU[key].map(rec=>({name:rec.name,recipe:rec.id,items:rec.items.map(([cid,gr])=>({pid:ensureProd(cid),g:gr}))}))}));
  S.schedule=[0,1,2,3,4,5,6].map(d=>Object.fromEntries(defs.map(([key])=>[key,d%BULK_MENU[key].length])));

/* ---------- Пересчёт всего рациона под новые цели ---------- */
function fitPlan(){
  // Понятная логика: белковые продукты держат белок, масло и жирное держат жиры, крупы/хлеб/картофель добирают калории.
  const T=targets(), used=new Map(), items=[];
  S.slots.forEach((s,si)=>{for(let d=0;d<7;d++){const vi=vIdx(s,d), key=si+":"+vi; const u=used.get(key); if(u) u.n++; else used.set(key,{si,vi,n:1})}});
  used.forEach(({si,vi,n},key)=>S.slots[si].variants[vi].items.forEach((it,ii)=>{const p=P(it.pid); if(!p) return; const kc=Math.max(p.kcal,1), g0=num(it.g);
    const role=p.p*4/kc>=0.45?"P":p.f*9/kc>=0.8?"F":p.c*4/kc>=0.5?"C":"M";
    items.push({key,si,vi,ii,pid:it.pid,g0,g:g0,u:[p.kcal,p.p,p.f,p.c].map(x=>x/100),fr:n/7,role,piece:p.pieceG&&p.pieceG<=60?p.pieceG:0})}));
  const avg=()=>items.reduce((a,x)=>a.map((v,i)=>v+x.u[i]*x.g*x.fr),[0,0,0,0]);
  const part=(role,i)=>items.filter(x=>x.role===role).reduce((a,x)=>a+x.u[i]*x.g*x.fr,0);
  const scale=(role,k,lo,hi)=>items.filter(x=>x.role===role).forEach(x=>{x.g=Math.min(x.g0*hi+(role==="F"?10:0),Math.max(x.g0*lo,x.g0*k))});
  // 1. Белок
  let A=avg(), pp=part("P",1);
  if(pp>0&&A[1]<T.p*0.95) scale("P",(T.p-(A[1]-pp))/pp,1,2);
  else if(pp>0&&A[1]>T.p*1.3) scale("P",Math.max(0.8,(T.p*1.2-(A[1]-pp))/pp),0.8,1);
  // 2. Жиры: через масло и жирные продукты, иначе через смешанные (яйца)
  A=avg(); let fr=items.some(x=>x.role==="F")?"F":"M", fp=part(fr,2);
  if(fp>0&&Math.abs(A[2]-T.f)>3) scale(fr,(T.f-(A[2]-fp))/fp,fr==="F"?0:0.5,fr==="F"?3:1.6);
  // 3. Калории: крупы, хлеб, картофель
  A=avg(); const ck=part("C",0);
  if(ck>0) scale("C",(T.kcal-(A[0]-ck))/ck,0.35,3);
  // Округление: штучное до целых, остальное до 5 г
  items.forEach(x=>{x.g=x.piece?Math.max(x.role==="C"||x.role==="M"?x.piece:0,Math.round(x.g/x.piece)*x.piece):Math.max(0,r5(x.g)); if(x.role==="F"&&x.g0>0&&x.g<5&&T.f>40) x.g=0});
  // Точная доводка калорий после округления: через крупы в граммах (рис, макароны, картофель)
  for(let pass=0;pass<3;pass++){A=avg(); const diff=T.kcal-A[0]; if(Math.abs(diff)<=T.kcal*0.015) break;
    const cs=items.filter(x=>x.role==="C"&&!x.piece&&x.g>0), cK=cs.reduce((a,x)=>a+x.u[0]*x.g*x.fr,0); if(!cK) break;
    cs.forEach(x=>{x.g=Math.max(r5(x.g0*0.35),r5(x.g*(1+diff/cK)))})}
  const days=[0,1,2,3,4,5,6].map(d=>S.slots.map((s,si)=>si+":"+vIdx(s,d)));
  const byKey={}; items.forEach(x=>(byKey[x.key]=byKey[x.key]||[]).push(x));
  const dayTot=d=>days[d].reduce((a,k)=>(byKey[k]||[]).reduce((b,x)=>b.map((v,i)=>v+x.u[i]*x.g),a),[0,0,0,0]);
  // Доводка по каждому дню: чтобы не только среднее, а каждый день был в цели
  items.forEach(x=>{x.gf=x.g; const lo={P:0.85,F:0,C:0.5,M:0.6}[x.role], hi={P:1.1,F:2,C:1.6,M:1.3}[x.role];
    x.lo=x.piece?Math.max(x.role==="C"||x.role==="M"?x.piece:0,Math.floor(x.g*lo/x.piece)*x.piece):x.g*lo; x.hi=x.piece?Math.ceil(x.g*hi/x.piece)*x.piece:x.g*hi+(x.role==="F"?5:0);
    x.st=x.piece||5; x.w=x.role==="P"?1:x.role==="C"?0.1:0.3});
  const DT=[0,1,2,3,4,5,6].map(d=>dayTarget(d));
  const dcost=()=>{let c=0; for(let d=0;d<7;d++){const t=dayTot(d), Td=DT[d];
      const ek=(t[0]-Td.kcal)/(Td.kcal*0.02), ef=Math.max(0,t[2]-Td.fLimit)/3, ef2=(t[2]-Td.f)/8, ep=Math.max(0,Td.p*0.95-t[1])/4, ec=(t[3]-Td.c)/25;
      c+=ek*ek+ef*ef+ef2*ef2*0.5+ep*ep+ec*ec*0.3}
    for(const x of items){if(!x.gf) continue; const rel=(x.g-x.gf)/Math.max(x.gf,20); c+=rel*rel*x.w*7} return c};
  let dc=dcost();
  for(let n=0;n<1500;n++){let best=null;
    for(const x of items){for(const ng of [x.g-x.st,x.g+x.st]){if(ng<x.lo-0.01||ng>x.hi+0.01||ng<0) continue; const o=x.g; x.g=ng; const c=dcost(); x.g=o; if(c<dc-1e-6&&(!best||c<best.c)) best={x,ng,c}}}
    if(!best) break; best.x.g=best.ng; dc=best.c}
  const before=[0,1,2,3,4,5,6].reduce((a,d)=>add(a,dayTotal(d)),Z()).map(v=>v/7);
  const after=[0,1,2,3,4,5,6].reduce((a,d)=>add(a,dayTot(d)),Z()).map(v=>v/7);
  return {items,before,after,T};
}
function sheetPlanFit(){

  const ch=Object.values(groups).map(xs=>{const s=S.slots[xs[0].si], v=s.variants[xs[0].vi];
    return `<div class="row" style="cursor:default;padding:9px 0"><span class="w"><span class="n">${esc(s.name)} · ${esc(v.name)}</span><span class="h">${xs.map(x=>`${esc((P(x.pid)?.name||"?").split(" (")[0])}: ${r(x.g0)} → <b>${r(x.g)}</b> г`).join("<br>")}</span></span></div>`}).join("");
  const st=(ok)=>ok?"ok":"warn";
  openSheet("Пересчёт рациона",`
    <div class="note tip">Приложение подобрало граммы во всех приёмах недели так, чтобы рацион в среднем попал в цель: <b>${GOALS[S.profile.goal]||""}</b>, ${r(T.kcal)} ккал.</div>
    <div class="grp">В среднем за день: было → станет</div>
    <div class="list">${cmpRow("Калории",b[0],a[0],T.kcal,"ккал",st(Math.abs(a[0]-T.kcal)<=T.kcal*0.03))}${cmpRow("Белок",b[1],a[1],T.p,"г",st(a[1]>=T.p*0.9))}${cmpRow("Жиры",b[2],a[2],T.f,"г",st(a[2]<=T.fLimit))}${cmpRow("Углеводы",b[3],a[3],T.c,"г",st(Math.abs(a[3]-T.c)<=35))}</div>
    <div class="grp">Что изменится</div>

    <button class="btn ghost block" data-act="close">Отмена</button>`);
}
function applyPlanFit(){
  const res=ctx.plan; if(!res) return;
  S.planUndo=clone(S.slots);
  res.items.forEach(x=>{const it=S.slots[x.si].variants[x.vi].items[x.ii]; if(it) it.g=Math.round(x.g*10)/10});
  const usedKeys=new Set(res.items.map(x=>x.key)), k=res.before[0]>0?res.after[0]/res.before[0]:1;
  S.slots.forEach((s,si)=>s.variants.forEach((v,vi)=>{if(usedKeys.has(si+":"+vi)) return; v.items.forEach(it=>{it.g=Math.max(5,r5(num(it.g)*k))})}));
  S.slots.forEach(s=>s.variants.forEach(v=>{v.items=v.items.filter(it=>num(it.g)>0)}));
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]"); if(!b) return; const a=b.dataset.act;
  if(a==="planfit"){sheetPlanFit(); return}
  if(a==="planfitok"){applyPlanFit(); closeSheet(); commit(); return}
  if(a==="planundo"){if(S.planUndo){S.slots=S.planUndo; S.planUndo=null; S.slots.forEach(s=>S.schedule.forEach(d=>{if((d[s.key]||0)>=s.variants.length) d[s.key]=0})); commit()} return}
});

/* ==================== УГЛЕВОДЫ ПО ДНЯМ ТРЕНИРОВОК ==================== */
function cycleDelta(d){
  const on=num(S.profile.cycle)||0; if(!on||!S.train) return 0;
  const w=S.train.week||[], nT=w.filter(Boolean).length, nR=7-nT; if(!nT||!nR) return 0;
  return w[d]?on:-on*nT/nR;
}
function dayTarget(d){const T=targets(), x=cycleDelta(d); if(!x) return T; return Object.assign({},T,{kcal:T.kcal+x,c:Math.max(0,T.c+x/4)})}
function removeCycle(){
  S.slots.forEach(s=>{
    [S.schedule,S.baseSchedule].forEach(sch=>sch&&sch.forEach(day=>{const v=s.variants[day[s.key]||0]; if(v&&v.cycleOf!=null) day[s.key]=v.cycleOf}));
    for(let vi=s.variants.length-1;vi>=0;vi--){ if(s.variants[vi].cycleOf==null) continue;
      s.variants.splice(vi,1);
      [S.schedule,S.baseSchedule].forEach(sch=>sch&&sch.forEach(day=>{const x=day[s.key]||0; if(x>vi) day[s.key]=x-1}));
    }
  });
}
function applyCycle(){
  removeCycle();
  if(!num(S.profile.cycle)) return;
  for(let d=0;d<7;d++){
    const delta=cycleDelta(d); if(!delta) continue;
    const isGrain=it=>{const p=P(it.pid); if(!p) return false; const kc=Math.max(p.kcal,1); return p.c*4/kc>=0.5&&!(p.pieceG&&p.pieceG<=60)};
    const parts=S.slots.map((s,si)=>{const v=variantOf(s,d); const ck=v.items.reduce((a,it)=>isGrain(it)?a+mac(it)[0]:a,0); return {s,si,v,ck}}).filter(x=>x.ck>40);
    const total=parts.reduce((a,x)=>a+x.ck,0); if(!total) continue;
    const f=Math.min(2.2,Math.max(0.35,1+delta/total));
    parts.forEach(({s,v})=>{
      const vi=vIdx(s,d), copy=clone(v); copy.cycleOf=vi; copy.name=v.name+(delta>0?" · трен.":" · отдых");
      copy.items.forEach(it=>{if(isGrain(it)) it.g=Math.max(5,r5(it.g*f))});
      s.variants.push(copy); const ni=s.variants.length-1; S.schedule[d][s.key]=ni; if(S.baseSchedule&&S.baseSchedule[d]) S.baseSchedule[d][s.key]=ni;
    });
  }
}
function cycleCard(){
  const p=S.profile, w=(S.train&&S.train.week)||[], tdays=WD.filter((_,i)=>w[i]), on=num(p.cycle)||0;
  const nT=tdays.length, nR=7-nT;
  return `<span class="flabel">Углеводы по дням тренировок</span>
    <div class="seg">${[["0","Выкл"],["150","±150 ккал"],["250","±250 ккал"]].map(([v,l])=>`<button data-act="cyc" data-v="${v}" aria-pressed="${String(on)===v}">${l}</button>`).join("")}</div>
    ${on?(nT&&nR?`<div class="note">Тренировки: <b>${tdays.join(", ")}</b> (+${on} ккал, больше крупы). Отдых: ${WD.filter((_,i)=>!w[i]).join(", ")} (−${Math.round(on*nT/nR)} ккал). За неделю калории те же.</div>`
      :`<div class="hint warn">Отметьте дни тренировок во вкладке «Тренировки → Программа → Неделя».</div>`):""}`;

/* ==================== ДНЕВНИК ВЕСА ==================== */
function weightsAsc(){return (S.weights||[]).slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0)}
function addWeight(date,w){
  if(!(w>20&&w<400)) return false; if(!S.weights) S.weights=[];
  const ex=S.weights.find(x=>x.date===date); if(ex) ex.w=w; else S.weights.push({date,w});
  const last=weightsAsc().slice(-1)[0]; if(last&&last.date===date) S.profile.weight=w;
  return true;
}
function trendSeries(ws){
  let tr=null, prev=null; return ws.map(x=>{const t=pDate(x.date).getTime();
    if(tr==null) tr=x.w; else {const dt=Math.max(0.5,(t-prev)/864e5); tr=tr+(1-Math.exp(-dt/10))*(x.w-tr)} prev=t; return {t,w:x.w,tr}});
}

  const xs=pts.map(p=>(p.t-pts[0].t)/864e5), ys=pts.map(p=>p.w), n=xs.length, mx=xs.reduce((a,b)=>a+b)/n, my=ys.reduce((a,b)=>a+b)/n;
  const k=xs.reduce((a,x,i)=>a+(x-mx)*(ys[i]-my),0)/xs.reduce((a,x)=>a+(x-mx)*(x-mx),0);
  return {rate:k*7,span:Math.round(span),n};

function weightAdvice(R,cur){
  const g=S.profile.goal, w=cur||num(S.profile.weight);
  if(!R) return {cls:"neutral",txt:"Для оценки темпа нужно 3+ взвешивания за 10+ дней. Взвешивайтесь в зале в одно время, до тренировки.",adj:0};
  const r=R.rate, pct=r/w*100;
  if(g==="cut"){
    if(r>-0.15) return {cls:"warn",txt:`Вес почти стоит (${signed(r,"кг/нед",2)}). Уберите ~150 ккал в день или добавьте 2-3 тыс. шагов.`,adj:-150};
    if(pct<-1.0) return {cls:"warn",txt:`Слишком быстро (${signed(r,"кг/нед",2)}): есть риск терять мышцы. Добавьте ~150 ккал.`,adj:150};
    return {cls:"ok",txt:`Хороший темп: ${signed(r,"кг/нед",2)}. Ничего не меняйте.`,adj:0};
  }
  if(g==="bulk"){
    if(r<0.05) return {cls:"warn",txt:`Вес не растёт (${signed(r,"кг/нед",2)}). Добавьте ~150 ккал в день.`,adj:150};
    if(pct>0.6) return {cls:"warn",txt:`Набор слишком быстрый (${signed(r,"кг/нед",2)}), будет больше жира. Уберите ~100 ккал.`,adj:-100};
    return {cls:"ok",txt:`Хороший темп набора: ${signed(r,"кг/нед",2)}.`,adj:0};
  }
  if(Math.abs(r)<=0.15) return {cls:"ok",txt:`Вес стабилен (${signed(r,"кг/нед",2)}).`,adj:0};
  return {cls:"warn",txt:`Вес ${r>0?"растёт":"снижается"} (${signed(r,"кг/нед",2)}). ${r>0?"Уберите":"Добавьте"} ~100 ккал.`,adj:r>0?-100:100};
}
function weightChart(ser){
  if(ser.length<2) return "";
  const W=320,H=160,pl=34,pr=10,pt=12,pb=24, vs=ser.flatMap(p=>[p.w,p.tr]); let mn=Math.min(...vs), mx=Math.max(...vs); if(mx-mn<1){mx+=0.5;mn-=0.5} const pad=(mx-mn)*0.15; mn-=pad; mx+=pad;
  const t0=ser[0].t, t1=ser[ser.length-1].t||t0+1, x=t=>pl+(W-pl-pr)*((t-t0)/Math.max(1,t1-t0)), y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  const ticks=[mn+(mx-mn)*0.15,(mn+mx)/2,mx-(mx-mn)*0.15], fd=t=>new Date(t).toLocaleDateString("ru-RU",{day:"numeric",month:"short"});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="График веса">
    ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" stroke="var(--line)"/><text x="${pl-4}" y="${(y(t)+3).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)">${String(Math.round(t*10)/10).replace(".",",")}</text>`).join("")}
    <polyline points="${ser.map(p=>`${x(p.t).toFixed(1)},${y(p.tr).toFixed(1)}`).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${ser.map(p=>`<circle cx="${x(p.t).toFixed(1)}" cy="${y(p.w).toFixed(1)}" r="3" fill="var(--surface)" stroke="var(--muted)" stroke-width="1.5"/>`).join("")}
    <text x="${pl}" y="${H-6}" font-size="10" fill="var(--muted)">${fd(t0)}</text><text x="${W-pr}" y="${H-6}" font-size="10" fill="var(--muted)" text-anchor="end">${fd(t1)}</text></svg>
    <div class="legend"><span><i class="lg-line"></i>тренд</span><span><i class="lg-dot"></i>взвешивания</span></div>`;
}
function viewWeight(){
  const ws=weightsAsc(), ser=trendSeries(ws), last=ser[ser.length-1], first=ser[0], R=weeklyRate(ser), adv=weightAdvice(R,last&&last.tr);
  let h=`<header class="toprow"><div><div class="eyebrow">Дневник веса</div><h1>Вес</h1><div class="sub">Взвешивайтесь в зале в одно время, до тренировки</div></div>${syncHtml()}</header>`;

    <button class="btn primary block" data-act="w_add">Записать</button><div id="wMsg"></div></section>`;
  if(!ws.length) return h+`<section class="card"><div class="empty">Запишите первое взвешивание. Через 2-3 недели здесь появятся тренд и подсказка, как поправить калории.</div></section>`;
  h+=`<section class="hero"><div class="hero-in">

    <div class="hero-k"><span class="lbl">В неделю</span><span class="v num">${R?signed(R.rate,"",2):"–"}</span></div></div></section>`;
  h+=`<div class="hint ${adv.cls==="warn"?"warn":""}">${esc(adv.txt)}</div>`;
  if(adv.adj) h+=`<button class="btn block" data-act="w_adj" data-v="${adv.adj}">${adv.adj>0?"Добавить":"Убрать"} ${Math.abs(adv.adj)} ккал и пересчитать рацион</button>`;
  if(ser.length>=2) h+=`<section class="card">${weightChart(ser)}</section>`;
  h+=`<p class="note">Тренд сглаживает скачки из-за воды, соли и еды. Ориентируйтесь на него, а не на одно взвешивание.</p>`;
  h+=`<div class="grp">Записи</div><section class="card" style="gap:0;padding-block:4px">${ser.slice().reverse().map((p,i,arr)=>{const prev=arr[i+1]; const d=new Date(p.t);
    return `<div class="row" style="cursor:default;padding:11px 0"><span class="w"><span class="n">${d.toLocaleDateString("ru-RU",{weekday:"short",day:"numeric",month:"long"})}</span></span><span class="r num"><b>${fmtW(p.w)} кг</b>${prev?` <span class="pill ${p.w<=prev.w?"neutral":"neutral"}">${signed(p.w-prev.w,"",1)}</span>`:""}</span><button class="x" data-act="w_del" data-d="${ws[ws.length-1-i].date}" aria-label="Удалить запись" style="margin-left:8px">✕</button></div>`}).join("")}</section>`;
  return h;
}
